name: Restore source bundle

on:
  push:
    branches: [main]
    paths:
      - 'tools/source_restore.zip'
      - 'tools/source_restore_parts/**'
      - 'tools/restore_source_bundle.py'
      - '.github/workflows/restore-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Restore source files
        run: python tools/restore_source_bundle.py
      - name: Verify restored source
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app.py
          python -m pytest -q
      - name: Commit restored source
        run: |
          git config user.name 'KROLIK Restore Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py smart_cutout.py runtime_package.py rig_tools.py constraint_solver.py interaction_runtime.py life_sim.py mesh_deform.py web tests runtime_godot/scripts/runtime_prop.gd tools/prepare_ai_models.py tools/qa_all_characters.py
          if git diff --cached --quiet; then
            echo 'Source already synchronized.'
            exit 0
          fi
          git commit -m 'Restore complete stable source tree'
          git push origin HEAD:main
