name: Windows Godot Scale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime_godot/**'
      - 'runtime_package.py'
      - 'character_import.py'
      - 'rig_tools.py'
      - 'tools/build_core_vertical_slice.py'
      - '.github/workflows/windows-godot-scale.yml'

jobs:
  rendered-production-agents:
    name: rendered-production-agents-${{ matrix.agents }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agents: [220, 300, 500]
    env:
      PYTHONPATH: .
      GODOT_VERSION: '4.7.2'
      GODOT_WIN_SHA256: '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
      STRESS_MAX_WORKING_SET_BYTES: '2147483648'
      KROLIK_SCALE_AGENTS: '${{ matrix.agents }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install vertical-slice dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Build production visual package for scale population
        shell: pwsh
        run: |
          if (Test-Path runtime_godot/.ci_windows_scale) { Remove-Item runtime_godot/.ci_windows_scale -Recurse -Force }
          python tools/build_core_vertical_slice.py --output-root runtime_godot/.ci_windows_scale
          if ($LASTEXITCODE -ne 0) { throw "core vertical-slice package build failed" }
          $manifest = 'runtime_godot/.ci_windows_scale/exports/runtime/ci_core_slice/manifest.json'
          if (-not (Test-Path $manifest)) { throw "scale manifest missing" }

      - name: Download checksum-pinned official Godot for Windows
        shell: pwsh
        run: |
          $archive = "Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_WIN_SHA256) {
            throw "Godot Windows SHA256 mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath godot-bin -Force
          $godot = Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe"
          $versionOutput = (& $godot --version 2>&1 | Out-String).Trim()
          Write-Host $versionOutput
          if ($versionOutput -notmatch [regex]::Escape($env:GODOT_VERSION)) {
            throw "Godot version output did not contain expected version $env:GODOT_VERSION"
          }
          $global:LASTEXITCODE = 0

      - name: Parse and import Godot project on Windows
        shell: pwsh
        run: |
          $godot = (Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          $importOutput = (& $godot --headless --path runtime_godot --editor --quit 2>&1 | Out-String)
          Write-Host $importOutput
          $fatalPatterns = @('SCRIPT ERROR', 'Parse Error', 'Failed to load script', 'Cannot get class', 'Could not resolve class')
          foreach ($pattern in $fatalPatterns) {
            if ($importOutput -match [regex]::Escape($pattern)) {
              throw "Godot Windows project import contained fatal marker: $pattern"
            }
          }
          if ($importOutput -notmatch 'Godot Engine v4\.7\.2') {
            throw 'Godot Windows project import did not start the expected engine'
          }
          $global:LASTEXITCODE = 0

      - name: Render and measure production-skinned population on Windows
        shell: pwsh
        run: |
          $godot = (Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          $artifactDir = "runtime_godot/windows_scale_artifacts_$env:KROLIK_SCALE_AGENTS"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $resolvedArtifactDir = (Resolve-Path $artifactDir).Path
          $stdout = $resolvedArtifactDir + '\stress_stdout.txt'
          $stderr = $resolvedArtifactDir + '\stress_stderr.txt'
          $metrics = $resolvedArtifactDir + '\process_metrics.json'

          $env:KROLIK_STRESS_AGENTS = $env:KROLIK_SCALE_AGENTS
          $env:KROLIK_STRESS_WARMUP_FRAMES = '30'
          $env:KROLIK_STRESS_SAMPLE_FRAMES = '120'
          $env:KROLIK_STRESS_MAX_SECONDS = '60'
          $env:KROLIK_STRESS_MIN_MOVED_SHARE = '0.80'
          $env:KROLIK_STRESS_MIN_TRAVEL_PX = '8'
          $env:KROLIK_STRESS_MIN_PHASE_SECONDS = '2.0'
          $env:KROLIK_STRESS_MANIFEST_PATH = 'res://.ci_windows_scale/exports/runtime/ci_core_slice/manifest.json'
          $env:KROLIK_STRESS_REQUIRE_VISUALS = '1'
          $env:KROLIK_STRESS_SCREENSHOT_PATH = "res://windows_scale_artifacts_$env:KROLIK_SCALE_AGENTS/stress_$env:KROLIK_SCALE_AGENTS.png"

          $arguments = @(
            '--path', 'runtime_godot',
            '--rendering-method', 'gl_compatibility',
            '--audio-driver', 'Dummy',
            '--script', 'res://scripts/stress_harness.gd'
          )
          $process = Start-Process -FilePath $godot -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(180)
          [long]$peak = 0
          while (-not $process.HasExited) {
            Start-Sleep -Milliseconds 100
            $process.Refresh()
            if ($process.WorkingSet64 -gt $peak) { $peak = $process.WorkingSet64 }
            if ((Get-Date) -gt $deadline) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Windows rendered stress exceeded 180 second watchdog for $env:KROLIK_SCALE_AGENTS agents"
            }
          }
          $process.WaitForExit()
          $exitCode = $process.ExitCode
          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          Write-Host $out
          if ($err) { Write-Host '--- Godot stderr ---'; Write-Host $err }

          $metricLine = ($out -split "`r?`n" | Where-Object { $_ -like 'KROLIK_STRESS_METRIC *' } | Select-Object -Last 1)
          $renderLine = ($out -split "`r?`n" | Where-Object { $_ -like 'KROLIK_RENDER_STRESS *' } | Select-Object -Last 1)
          $record = [ordered]@{
            platform = 'windows-latest'
            godot = $env:GODOT_VERSION
            agents = [int]$env:KROLIK_SCALE_AGENTS
            sample_frames = 120
            peak_working_set_bytes = $peak
            peak_working_set_mib = [math]::Round($peak / 1MB, 2)
            process_exit_code = $exitCode
            stress_metric = $metricLine
            render_metric = $renderLine
            note = 'GitHub-hosted Windows runner using Microsoft Basic Render Driver via ANGLE; this is a software-render worst-case baseline, not target RX 6650 XT hardware.'
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -Path $metrics -Encoding utf8
          Write-Host "KROLIK_WINDOWS_SCALE agents=$env:KROLIK_SCALE_AGENTS peak_working_set_mib=$($record.peak_working_set_mib) process_exit_code=$exitCode"
          Write-Host $metricLine
          Write-Host $renderLine

          if (-not $metricLine) { throw 'KROLIK_STRESS_METRIC missing from Windows run' }
          if (-not $renderLine) { throw 'KROLIK_RENDER_STRESS missing from Windows run' }
          if ($out -match 'KROLIK stress:' -or $err -match 'SCRIPT ERROR|Parse Error|Failed to load script') {
            throw 'Windows rendered stress output contains a KROLIK/Godot failure marker'
          }
          if ($peak -gt [long]$env:STRESS_MAX_WORKING_SET_BYTES) {
            throw "Windows stress exceeded working-set budget: $peak > $env:STRESS_MAX_WORKING_SET_BYTES"
          }
          $screenshot = "$artifactDir/stress_$env:KROLIK_SCALE_AGENTS.png"
          if (-not (Test-Path $screenshot)) {
            throw "rendered Windows screenshot evidence missing: $screenshot"
          }
          $global:LASTEXITCODE = 0

      - name: Upload Windows rendered scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-godot-rendered-scale-${{ matrix.agents }}
          path: runtime_godot/windows_scale_artifacts_${{ matrix.agents }}/**
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup generated scale package
        if: always()
        shell: pwsh
        run: |
          if (Test-Path runtime_godot/.ci_windows_scale) { Remove-Item runtime_godot/.ci_windows_scale -Recurse -Force }
