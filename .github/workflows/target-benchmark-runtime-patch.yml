name: Target Benchmark Runtime Patch

on:
  push:
    branches:
      - 'work/target-hardware-benchmark-20260915'
    paths:
      - '.github/workflows/target-benchmark-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/target-hardware-benchmark-20260915
          fetch-depth: 0

      - name: Patch clean-Windows execution path
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/run_target_hardware_benchmark.ps1')
          s = p.read_text(encoding='utf-8')
          old = """    Invoke-NativeChecked 'Build core vertical slice' { python tools/build_core_vertical_slice.py --output-root $GeneratedPackageRoot }\n    Assert-File $ManifestDiskPath 'Generated production manifest'"""
          new = """    $previousPythonPath = [Environment]::GetEnvironmentVariable('PYTHONPATH', 'Process')\n    $pathSeparator = [IO.Path]::PathSeparator\n    $benchmarkPythonPath = if ([string]::IsNullOrWhiteSpace($previousPythonPath)) { $RepoRoot } else { \"$RepoRoot$pathSeparator$previousPythonPath\" }\n    [Environment]::SetEnvironmentVariable('PYTHONPATH', $benchmarkPythonPath, 'Process')\n    try {\n        Invoke-NativeChecked 'Build core vertical slice' { python (Join-Path $RepoRoot 'tools/build_core_vertical_slice.py') --output-root $GeneratedPackageRoot }\n    } finally {\n        [Environment]::SetEnvironmentVariable('PYTHONPATH', $previousPythonPath, 'Process')\n    }\n    Assert-File $ManifestDiskPath 'Generated production manifest'"""
          if old not in s:
              raise SystemExit('build invocation block not found')
          s = s.replace(old, new, 1)
          old2 = "$runArray = @($runs)"
          new2 = "$runArray = @($runs | ForEach-Object { $_ })"
          if old2 not in s:
              raise SystemExit('run-array block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Commit collector fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/run_target_hardware_benchmark.ps1
          git diff --cached --check
          git commit -m 'perf: make target benchmark runnable from clean Windows'
          git push origin HEAD:work/target-hardware-benchmark-20260915
