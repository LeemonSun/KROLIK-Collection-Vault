name: Target Benchmark Finalize Patch

on:
  push:
    branches:
      - 'work/target-hardware-benchmark-20260915'
    paths:
      - '.github/workflows/target-benchmark-finalize-patch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/target-hardware-benchmark-20260915
          fetch-depth: 0

      - name: Apply collector hardening and docs
        shell: python
        run: |
          from pathlib import Path

          collector = Path('tools/run_target_hardware_benchmark.ps1')
          text = collector.read_text(encoding='utf-8')
          old_peak = "        $process.WaitForExit()\n        $process.Refresh()\n        if ($process.WorkingSet64 -gt $peak) { $peak = $process.WorkingSet64 }\n        if (-not $timedOut) { $exitCode = $process.ExitCode }"
          new_peak = "        $process.WaitForExit()\n        if (-not $timedOut) { $exitCode = $process.ExitCode }"
          if old_peak not in text:
              raise SystemExit('post-exit WorkingSet64 block not found')
          text = text.replace(old_peak, new_peak, 1)

          old_failure = "if ($null -ne $finalFailure) {\n    Write-Error \"Benchmark aborted: $finalFailure\"\n    exit 1\n}\nif (-not $overallValid) {\n    Write-Error \"Benchmark completed but is not a valid target-hardware result. Inspect REPORT.md, runs.json, stdout/stderr and renderer fields in: $ArtifactsRoot\"\n    exit 2\n}"
          new_failure = "if ($null -ne $finalFailure) {\n    [Console]::Error.WriteLine(\"Benchmark aborted: $finalFailure\")\n    exit 1\n}\nif (-not $overallValid) {\n    [Console]::Error.WriteLine(\"Benchmark completed but is not a valid target-hardware result. Inspect REPORT.md, runs.json, stdout/stderr and renderer fields in: $ArtifactsRoot\")\n    exit 2\n}"
          if old_failure not in text:
              raise SystemExit('final exit block not found')
          collector.write_text(text.replace(old_failure, new_failure, 1), encoding='utf-8', newline='\n')

          docs = Path('docs/TARGET_HARDWARE_BENCHMARK.md')
          d = docs.read_text(encoding='utf-8')
          marker = '## CI contract and orchestration smoke'
          if marker not in d:
              d += "\n\n## CI contract and orchestration smoke\n\nThe Windows benchmark workflow uses two deliberately different checks. The contract job is the cheap syntax/configuration check and does not render. The orchestration smoke executes the real collector end-to-end with a 5-agent production stress point on GitHub-hosted Windows, verifies FPS/screenshot/log evidence, and requires the collector to reject GitHub's software renderer as target-hardware evidence with exit code 2. This proves the orchestration and rejection path without pretending hosted software rendering represents the target PC.\n"
              docs.write_text(d, encoding='utf-8', newline='\n')

      - name: Commit and push non-workflow fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/run_target_hardware_benchmark.ps1 docs/TARGET_HARDWARE_BENCHMARK.md
          git diff --cached --check
          git commit -m 'perf: harden target benchmark full-run validation'
          git push origin HEAD:work/target-hardware-benchmark-20260915
