name: DWPose Model Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rig_tools.py'
      - 'tools/fetch_dwpose_model.py'
      - 'tools/inspect_dwpose_model.py'
      - 'tools/smoke_dwpose_backend.py'
      - 'tests/test_dwpose_backend.py'
      - 'tests/test_dwpose_model_bootstrap.py'
      - 'tests/test_dwpose_model_contract.py'
      - 'models/dwpose/README.md'
      - '.github/workflows/dwpose-model-smoke.yml'

jobs:
  real-model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install real DWPose smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnxruntime Pillow opencv-python-headless
      - name: Syntax and lightweight contract regressions
        run: |
          python -m py_compile tools/fetch_dwpose_model.py tools/inspect_dwpose_model.py tools/smoke_dwpose_backend.py rig_tools.py
          pip install pytest
          pytest -q tests/test_dwpose_backend.py tests/test_dwpose_model_bootstrap.py tests/test_dwpose_model_contract.py
      - name: Cache pinned DWPose model
        uses: actions/cache@v4
        with:
          path: models/dwpose/dw-ll_ucoco_384.onnx
          key: dwpose-724f4ff2439ed61afb86fb8a1951ec39c6220682803b4a8bd4f598cd913b1843
      - name: Fetch checksum-pinned official DWPose model
        run: python tools/fetch_dwpose_model.py
      - name: Reverify model without network
        run: python tools/fetch_dwpose_model.py --check
      - name: Real ONNXRuntime inference and SimCC contract smoke
        run: python tools/inspect_dwpose_model.py
      - name: Fetch upstream DWPose inference-example image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            --output "${RUNNER_TEMP}/dwpose-pose1.png" \
            "https://raw.githubusercontent.com/IDEA-Research/DWPose/onnx/ControlNet-v1-1-nightly/test_imgs/pose1.png"
          test -s "${RUNNER_TEMP}/dwpose-pose1.png"
      - name: Production rig_tools DWPose backend smoke
        run: python tools/smoke_dwpose_backend.py "${RUNNER_TEMP}/dwpose-pose1.png" --min-confidence 0.18
