name: Target Hardware Benchmark Contract

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'tools/run_target_hardware_benchmark.ps1'
      - 'docs/TARGET_HARDWARE_BENCHMARK.md'
      - '.github/workflows/target-hardware-benchmark-contract.yml'
  pull_request:
    paths:
      - 'tools/run_target_hardware_benchmark.ps1'
      - 'docs/TARGET_HARDWARE_BENCHMARK.md'
      - '.github/workflows/target-hardware-benchmark-contract.yml'

jobs:
  windows-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell collector
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/run_target_hardware_benchmark.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "target-hardware collector has $($errors.Count) PowerShell parse error(s)"
          }
          Write-Host 'KROLIK_TARGET_POWERSHELL_PARSE status=ok'

      - name: Emit benchmark contract without rendering
        shell: pwsh
        run: |
          if (Test-Path target_benchmark_contract) { Remove-Item target_benchmark_contract -Recurse -Force }
          & ./tools/run_target_hardware_benchmark.ps1 -ValidateOnly -OutputRoot target_benchmark_contract
          if ($LASTEXITCODE -ne 0) { throw "collector validation mode failed: $LASTEXITCODE" }

      - name: Verify pinned comparable workload
        shell: pwsh
        run: |
          $path = 'target_benchmark_contract/validation.json'
          if (-not (Test-Path $path)) { throw 'validation.json missing' }
          $v = Get-Content $path -Raw | ConvertFrom-Json
          if ($v.schema -ne 'krolik.target-hardware-benchmark-contract/1') { throw "unexpected schema: $($v.schema)" }
          if ($v.godot_version -ne '4.7.2') { throw "unexpected Godot version: $($v.godot_version)" }
          if ($v.godot_archive_sha256 -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') { throw 'Godot archive checksum pin changed' }
          if ($v.rendering_method -ne 'gl_compatibility') { throw "unexpected rendering method: $($v.rendering_method)" }
          $agents = @($v.no_lod_agents | ForEach-Object { [int]$_ })
          if (($agents -join ',') -ne '220,300,500') { throw "canonical no-LOD population changed: $($agents -join ',')" }
          if ([int]$v.repeat -ne 3) { throw "canonical repeat count changed: $($v.repeat)" }
          if (-not [bool]$v.lod_enabled -or [int]$v.lod_agents -ne 500) { throw 'canonical 500-agent LOD point changed' }
          if ([int]$v.warmup_frames -ne 30 -or [int]$v.sample_frames -ne 120) { throw 'canonical frame counts changed' }
          if ([int]$v.watchdog_seconds -ne 180) { throw 'canonical watchdog changed' }
          if (@($v.hosted_baselines).Count -ne 4) { throw 'hosted reference baseline count changed' }
          Write-Host 'KROLIK_TARGET_BENCHMARK_CONTRACT_ASSERT status=ok agents=220,300,500 repeat=3 lod=500'

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-hardware-benchmark-contract
          path: target_benchmark_contract/validation.json
          if-no-files-found: error
          retention-days: 14

  windows-orchestration-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install collector runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Run real collector orchestration on hosted software renderer
        shell: pwsh
        run: |
          if (Test-Path target_benchmark_smoke) { Remove-Item target_benchmark_smoke -Recurse -Force }
          & ./tools/run_target_hardware_benchmark.ps1 -Agents 5 -Repeat 1 -SkipLod -SkipDependencyInstall -OutputRoot target_benchmark_smoke
          $collectorExit = $LASTEXITCODE
          Write-Host "KROLIK_TARGET_SMOKE_EXIT code=$collectorExit"
          if ($collectorExit -ne 2) { throw "Expected collector to reject hosted software renderer with exit 2; actual=$collectorExit" }
          exit 0

      - name: Verify full-run evidence and software-render rejection
        shell: pwsh
        run: |
          $resultPath = 'target_benchmark_smoke/result.json'
          if (-not (Test-Path $resultPath)) { throw 'full smoke result.json missing' }
          $r = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ([bool]$r.valid) { throw 'hosted software-render smoke was incorrectly marked target-hardware valid' }
          if ([int]$r.expected_runs -ne 1 -or [int]$r.completed_runs -ne 1) { throw "unexpected run counts: $($r.completed_runs)/$($r.expected_runs)" }
          if ([int]$r.successful_runs -ne 1) { throw "production harness did not complete successfully: $($r.successful_runs)" }
          if ([int]$r.hardware_valid_runs -ne 0) { throw "hosted software renderer unexpectedly counted as hardware-valid: $($r.hardware_valid_runs)" }
          if (@($r.summary).Count -ne 1) { throw 'expected exactly one summary point' }
          $point = @($r.summary)[0]
          if ([double]$point.median_fps -le 0) { throw "invalid measured FPS: $($point.median_fps)" }
          if (-not $point.renderer) { throw 'renderer evidence missing' }
          foreach ($path in @(
            'target_benchmark_smoke/no_lod_5_r1.stdout.txt',
            'target_benchmark_smoke/no_lod_5_r1.stderr.txt',
            'target_benchmark_smoke/no_lod_5_r1.png',
            'target_benchmark_smoke/REPORT.md',
            'target_benchmark_smoke/runs.json',
            'target_benchmark_smoke/summary.json'
          )) {
            if (-not (Test-Path $path)) { throw "full smoke evidence missing: $path" }
          }
          Write-Host "KROLIK_TARGET_ORCHESTRATION_SMOKE status=ok fps=$($point.median_fps) renderer=$($point.renderer) rejected_as_target_hardware=true"

      - name: Upload orchestration smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-hardware-benchmark-orchestration-smoke
          path: target_benchmark_smoke/**
          if-no-files-found: error
          retention-days: 14
