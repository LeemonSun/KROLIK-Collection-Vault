name: D4 Parser Diagnostic

on:
  push:
    branches:
      - work/d4-long-term-memory-20260915

permissions:
  contents: write

jobs:
  parse-agent-brain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/d4-long-term-memory-20260915
          fetch-depth: 0
      - name: Fix reserved D4 identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('runtime_godot/scripts/agent_brain.gd')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'var signal := clampf(valence, -1.0, 1.0)': 'var relationship_signal := clampf(valence, -1.0, 1.0)',
              'float(entry.get("affinity", 0.0)) * (1.0 - alpha) + signal * alpha': 'float(entry.get("affinity", 0.0)) * (1.0 - alpha) + relationship_signal * alpha',
              '"subject": subject, "affinity": signal * alpha': '"subject": subject, "affinity": relationship_signal * alpha',
              'var signal := clampf(preference, -1.0, 1.0)': 'var place_signal := clampf(preference, -1.0, 1.0)',
              'float(entry.get("preference", 0.0)) * (1.0 - alpha) + signal * alpha': 'float(entry.get("preference", 0.0)) * (1.0 - alpha) + place_signal * alpha',
              '"place": place, "preference": signal * alpha': '"place": place, "preference": place_signal * alpha',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected D4 text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Download verified Godot
        shell: bash
        run: |
          set -euo pipefail
          archive='Godot_v4.7.2-stable_linux.x86_64.zip'
          curl --fail --location --retry 4 --output "$archive" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  Godot_v4.7.2-stable_linux.x86_64.zip' | sha256sum --check --strict
          unzip -q "$archive" -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse agent brain directly
        shell: bash
        run: |
          set -o pipefail
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path runtime_godot --check-only --script res://scripts/agent_brain.gd 2>&1 | tee /tmp/parse.log
      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_godot/scripts/agent_brain.gd
          git diff --cached --check
          git commit -m 'fix: avoid reserved signal identifier in D4 brain'
          git push origin HEAD:work/d4-long-term-memory-20260915
