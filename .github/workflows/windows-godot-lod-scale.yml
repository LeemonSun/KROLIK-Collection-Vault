name: Windows Godot LOD Scale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime_godot/**'
      - 'runtime_package.py'
      - 'character_import.py'
      - 'rig_tools.py'
      - 'tools/build_core_vertical_slice.py'
      - '.github/workflows/windows-godot-lod-scale.yml'

jobs:
  production-lod-500:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      GODOT_VERSION: '4.7.2'
      GODOT_WIN_SHA256: '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
      LOD_MIN_FPS: '8.0'
      LOD_MAX_WORKING_SET_BYTES: '1610612736'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install vertical-slice dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Build production visual package
        shell: pwsh
        run: |
          if (Test-Path runtime_godot/.ci_vertical_slice) { Remove-Item runtime_godot/.ci_vertical_slice -Recurse -Force }
          python tools/build_core_vertical_slice.py --output-root runtime_godot/.ci_vertical_slice
          if ($LASTEXITCODE -ne 0) { throw 'core vertical-slice package build failed' }
          $manifest = 'runtime_godot/.ci_vertical_slice/exports/runtime/ci_core_slice/manifest.json'
          if (-not (Test-Path $manifest)) { throw 'LOD production manifest missing' }

      - name: Download checksum-pinned official Godot for Windows
        shell: pwsh
        run: |
          $archive = "Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_WIN_SHA256) { throw "Godot Windows SHA256 mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath godot-bin -Force
          $godot = Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe"
          $versionOutput = (& $godot --version 2>&1 | Out-String).Trim()
          Write-Host $versionOutput
          if ($versionOutput -notmatch [regex]::Escape($env:GODOT_VERSION)) { throw 'unexpected Godot version output' }
          $global:LASTEXITCODE = 0

      - name: Parse and import Godot project on Windows
        shell: pwsh
        run: |
          $godot = (Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          $importOutput = (& $godot --headless --path runtime_godot --editor --quit 2>&1 | Out-String)
          Write-Host $importOutput
          foreach ($pattern in @('SCRIPT ERROR', 'Parse Error', 'Failed to load script', 'Cannot get class', 'Could not resolve class')) {
            if ($importOutput -match [regex]::Escape($pattern)) { throw "Godot project import contained fatal marker: $pattern" }
          }
          if ($importOutput -notmatch 'Godot Engine v4\.7\.2') { throw 'Godot project import did not start expected engine' }
          $global:LASTEXITCODE = 0

      - name: Full reduced sleep wake continuity regression
        shell: pwsh
        run: |
          $godot = (Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          $output = (& $godot --headless --path runtime_godot --audio-driver Dummy --script res://scripts/population_lod_harness.gd 2>&1 | Out-String)
          Write-Host $output
          if ($output -notmatch 'KROLIK_POPULATION_LOD status=ok') { throw 'population LOD success marker missing' }
          if ($output -match 'KROLIK_POPULATION_LOD_FAIL|SCRIPT ERROR|Parse Error|Failed to load script') { throw 'population LOD regression emitted failure marker' }
          $global:LASTEXITCODE = 0

      - name: Render and measure 500 production agents with LOD
        shell: pwsh
        run: |
          $godot = (Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          New-Item -ItemType Directory -Force -Path runtime_godot/windows_lod_artifacts | Out-Null
          $artifactDir = (Resolve-Path runtime_godot/windows_lod_artifacts).Path
          $stdout = $artifactDir + '\stress_stdout.txt'
          $stderr = $artifactDir + '\stress_stderr.txt'
          $metrics = $artifactDir + '\process_metrics.json'

          $env:KROLIK_LOD_AGENTS = '500'
          $env:KROLIK_LOD_WARMUP_FRAMES = '30'
          $env:KROLIK_LOD_SAMPLE_FRAMES = '120'
          $env:KROLIK_LOD_MAX_SECONDS = '60'
          $env:KROLIK_LOD_FULL_RADIUS = '180'
          $env:KROLIK_LOD_SLEEP_RADIUS = '360'
          $env:KROLIK_LOD_WAKE_RADIUS = '330'
          $env:KROLIK_LOD_MANIFEST_PATH = 'res://.ci_vertical_slice/exports/runtime/ci_core_slice/manifest.json'
          $env:KROLIK_LOD_SCREENSHOT_PATH = 'res://windows_lod_artifacts/stress_lod_500.png'

          $arguments = @(
            '--path', 'runtime_godot',
            '--rendering-method', 'gl_compatibility',
            '--audio-driver', 'Dummy',
            '--script', 'res://scripts/lod_scale_harness.gd'
          )
          $process = Start-Process -FilePath $godot -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(180)
          [long]$peak = 0
          while (-not $process.HasExited) {
            Start-Sleep -Milliseconds 100
            $process.Refresh()
            if ($process.WorkingSet64 -gt $peak) { $peak = $process.WorkingSet64 }
            if ((Get-Date) -gt $deadline) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Windows LOD rendered stress exceeded 180 second watchdog'
            }
          }
          $process.WaitForExit()
          $exitCode = $process.ExitCode
          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          Write-Host $out
          if ($err) { Write-Host '--- Godot stderr ---'; Write-Host $err }

          $metricLine = ($out -split "`r?`n" | Where-Object { $_ -like 'KROLIK_LOD_SCALE_METRIC *' } | Select-Object -Last 1)
          $renderLine = ($out -split "`r?`n" | Where-Object { $_ -like 'KROLIK_LOD_RENDER_STRESS *' } | Select-Object -Last 1)
          [double]$lodFps = 0.0
          if ($metricLine -match 'sim_fps=([0-9]+(?:\.[0-9]+)?)') {
            $lodFps = [double]$Matches[1]
          }
          $record = [ordered]@{
            platform = 'windows-latest'
            godot = $env:GODOT_VERSION
            agents = 500
            peak_working_set_bytes = $peak
            peak_working_set_mib = [math]::Round($peak / 1MB, 2)
            process_exit_code = $exitCode
            measured_fps = $lodFps
            minimum_fps = [double]$env:LOD_MIN_FPS
            speedup_vs_no_lod_baseline = [math]::Round($lodFps / 3.42, 2)
            lod_metric = $metricLine
            render_metric = $renderLine
            baseline_without_lod = '3.42 FPS / 1172.12 MiB on Microsoft Basic Render Driver, workflow run 34933824299'
            note = 'GitHub-hosted Windows runner using Microsoft Basic Render Driver via ANGLE; not target RX 6650 XT hardware.'
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -Path $metrics -Encoding utf8
          Write-Host "KROLIK_WINDOWS_LOD fps=$lodFps min_fps=$env:LOD_MIN_FPS speedup=$($record.speedup_vs_no_lod_baseline)x peak_working_set_mib=$($record.peak_working_set_mib) process_exit_code=$exitCode"
          Write-Host $metricLine
          Write-Host $renderLine

          if (-not $metricLine) { throw 'KROLIK_LOD_SCALE_METRIC missing from Windows run' }
          if (-not $renderLine) { throw 'KROLIK_LOD_RENDER_STRESS missing from Windows run' }
          if ($lodFps -le 0.0) { throw 'unable to parse LOD sim_fps metric' }
          if ($lodFps -lt [double]$env:LOD_MIN_FPS) { throw "LOD performance regression: $lodFps FPS < $env:LOD_MIN_FPS FPS floor" }
          if ($out -match 'KROLIK LOD scale:' -or $err -match 'SCRIPT ERROR|Parse Error|Failed to load script') { throw 'Windows LOD stress contains failure marker' }
          if ($peak -gt [long]$env:LOD_MAX_WORKING_SET_BYTES) { throw "Windows LOD stress exceeded working-set budget: $peak > $env:LOD_MAX_WORKING_SET_BYTES" }
          if (-not (Test-Path runtime_godot/windows_lod_artifacts/stress_lod_500.png)) { throw 'LOD screenshot evidence missing' }
          $global:LASTEXITCODE = 0

      - name: Upload Windows LOD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-godot-lod-scale-500
          path: runtime_godot/windows_lod_artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup generated package
        if: always()
        shell: pwsh
        run: |
          if (Test-Path runtime_godot/.ci_vertical_slice) { Remove-Item runtime_godot/.ci_vertical_slice -Recurse -Force }
