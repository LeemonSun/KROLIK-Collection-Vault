name: TEMP Gold Quality Bootstrap

on:
  push:
    branches: [work/gold-elf-regression-20260915]
    paths:
      - 'tools/bootstrap_gold_quality_v2.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gold-elf-regression-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest numpy Pillow opencv-python-headless
      - name: Apply reviewed cutout and joint-confidence patch
        run: python tools/bootstrap_gold_quality_v2.py
      - name: Validate patched core
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile character_import.py rig_tools.py
          pytest -q tests/test_cutout_grabcut_v2.py tests/test_dwpose_joint_confidence.py tests/test_character_import.py tests/test_character_import_modes.py tests/test_auto_rig_review.py
      - name: Commit verified product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KROLIK CI Bootstrap'
          git config user.email 'actions@github.com'
          git add character_import.py rig_tools.py tests/test_cutout_grabcut_v2.py tests/test_dwpose_joint_confidence.py
          if git diff --cached --quiet; then
            echo 'No patch changes to commit'
            exit 0
          fi
          git commit -m 'import: add cutout v2 fallback and per-joint confidence [gold-quality-bootstrap]'
          git push origin HEAD:work/gold-elf-regression-20260915
