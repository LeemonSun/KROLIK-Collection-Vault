name: Godot Runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'runtime_godot/**'
      - 'content/animations/**'
      - 'content/ai/**'
      - 'animation_content.py'
      - 'ai_policy.py'
      - 'life_sim.py'
      - 'motion_quality.py'
      - 'runtime_package.py'
      - 'rig_tools.py'
      - 'character_import.py'
      - 'tools/build_core_vertical_slice.py'
      - 'tools/build_import_qa_matrix.py'
      - 'tools/import_character_package.py'
      - 'tests/test_runtime_skinning.py'
      - 'tests/test_character_import.py'
      - 'tests/test_character_import_modes.py'
      - 'tests/test_import_qa_matrix.py'
      - 'tests/test_core_vertical_slice.py'
      - '.github/workflows/godot-runtime.yml'
  pull_request:
    paths:
      - 'runtime_godot/**'
      - 'content/animations/**'
      - 'content/ai/**'
      - 'animation_content.py'
      - 'ai_policy.py'
      - 'life_sim.py'
      - 'motion_quality.py'
      - 'runtime_package.py'
      - 'rig_tools.py'
      - 'character_import.py'
      - 'tools/build_core_vertical_slice.py'
      - 'tools/build_import_qa_matrix.py'
      - 'tools/import_character_package.py'
      - 'tests/test_runtime_skinning.py'
      - 'tests/test_character_import.py'
      - 'tests/test_character_import_modes.py'
      - 'tests/test_import_qa_matrix.py'
      - 'tests/test_core_vertical_slice.py'
      - '.github/workflows/godot-runtime.yml'
  workflow_dispatch:

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
      STRESS_MAX_RSS_KB: '524288'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install vertical-slice builder dependencies
        run: python -m pip install Pillow numpy
      - name: Import-pipeline syntax
        run: python -m py_compile character_import.py tools/build_core_vertical_slice.py tools/build_import_qa_matrix.py tools/import_character_package.py
      - name: Download verified Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}"
          curl --fail --location --retry 4 --output "$archive" "$url"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
      - name: Parse and import Godot project
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 90s "$GODOT" --headless --path runtime_godot --editor --quit
      - name: Headless runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --quit-after 2
      - name: Build ordinary-image import vertical slice package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime_godot/.ci_vertical_slice
          python tools/build_core_vertical_slice.py --output-root runtime_godot/.ci_vertical_slice
      - name: Production Python-to-Godot real-image vertical slice regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 45s "$GODOT" --headless --path runtime_godot --script res://scripts/core_vertical_slice_harness.gd
      - name: Upload real-image import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-image-import-evidence
          path: |
            runtime_godot/.ci_vertical_slice/fixture_input.png
            runtime_godot/.ci_vertical_slice/imports/**
            runtime_godot/.ci_vertical_slice/exports/runtime/ci_core_slice/**
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup vertical slice workspace
        if: always()
        shell: bash
        run: rm -rf runtime_godot/.ci_vertical_slice
      - name: Build multi-format import QA matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime_godot/.ci_import_matrix
          python tools/build_import_qa_matrix.py --output-root runtime_godot/.ci_import_matrix
      - name: Production Godot multi-format import matrix regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 60s "$GODOT" --headless --path runtime_godot --script res://scripts/import_matrix_harness.gd
      - name: Upload import QA matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-qa-matrix-evidence
          path: runtime_godot/.ci_import_matrix/**
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup import QA matrix
        if: always()
        shell: bash
        run: rm -rf runtime_godot/.ci_import_matrix
      - name: Generated AI policy runtime regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/ai_policy_harness.gd
      - name: Personality trait runtime regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/personality_harness.gd
      - name: Short-term memory runtime regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/memory_harness.gd
      - name: Animation clip validation regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/animation_validation_harness.gd
      - name: Authored motion library runtime regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          cp content/animations/default_v1.json runtime_godot/.ci_motion_library.json
          trap 'rm -f runtime_godot/.ci_motion_library.json' EXIT
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/motion_library_harness.gd
      - name: Layered animation regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/layered_animation_harness.gd
      - name: Facial mood state regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/facial_state_harness.gd
      - name: Secondary motion production regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/secondary_motion_harness.gd
      - name: IK joint angle limit regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/ik_limit_harness.gd
      - name: Rendered Skeleton2D Polygon2D deformation regression
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          command -v xvfb-run >/dev/null || { echo 'xvfb-run is required for rendered deformation regression' >&2; exit 1; }
          rm -rf runtime_godot/deformation_artifacts
          timeout 90s xvfb-run -a -s '-screen 0 1280x720x24' \
            "$GODOT" --path runtime_godot --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/deformation_harness.gd
          test -s runtime_godot/deformation_artifacts/tall_baseline.png
          test -s runtime_godot/deformation_artifacts/tall_posed.png
          test -s runtime_godot/deformation_artifacts/compact_baseline.png
          test -s runtime_godot/deformation_artifacts/compact_posed.png
      - name: Upload deformation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-deformation-evidence
          path: runtime_godot/deformation_artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: 220 live-agent stress smoke with RSS budget
        shell: bash
        run: |
          set -uo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          metrics="${RUNNER_TEMP}/godot-stress-time.txt"
          output="${RUNNER_TEMP}/godot-stress-output.txt"
          stress_status=0
          if /usr/bin/time -v -o "$metrics" timeout --signal=TERM --kill-after=10s 90s "$GODOT" --headless --path runtime_godot --script res://scripts/stress_harness.gd >"$output" 2>&1; then stress_status=0; else stress_status=$?; fi
          cat "$output"
          cat "$metrics"
          echo "KROLIK_STRESS_PROCESS_STATUS=${stress_status}"
          max_rss_kb="$(awk -F: '/Maximum resident set size \(kbytes\)/ {gsub(/^[[:space:]]+/, "", $2); print $2}' "$metrics")"
          if [[ ! "$max_rss_kb" =~ ^[0-9]+$ ]]; then echo "Unable to parse maximum RSS" >&2; exit 1; fi
          stress_metric="$(awk 'index($0, "KROLIK_STRESS_METRIC ") {line=$0; sub(/^.*KROLIK_STRESS_METRIC /, "KROLIK_STRESS_METRIC ", line); metric=line} END {print metric}' "$output")"
          if [[ -z "$stress_metric" ]]; then stress_metric="KROLIK_STRESS_METRIC unavailable_in_captured_stdout"; fi
          echo "KROLIK_STRESS_PROCESS status=${stress_status} max_rss_kb=${max_rss_kb} max_rss_mib=$(( (max_rss_kb + 1023) / 1024 )) budget_kb=${STRESS_MAX_RSS_KB}"
          {
            echo '### KROLIK 220-agent runtime stress'; echo; echo "- ${stress_metric}"; echo "- process_status=${stress_status}"; echo "- max_rss_kb=${max_rss_kb} (~$(( (max_rss_kb + 1023) / 1024 )) MiB), budget=${STRESS_MAX_RSS_KB} KiB";
          } >> "$GITHUB_STEP_SUMMARY"
          if (( max_rss_kb > STRESS_MAX_RSS_KB )); then echo "Stress process exceeded RSS budget" >&2; exit 1; fi
          if (( stress_status != 0 )); then tail -n 100 "$output" >&2 || true; exit "$stress_status"; fi
