name: Godot Runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'runtime_godot/**'
      - 'runtime_package.py'
      - 'rig_tools.py'
      - 'tests/test_runtime_skinning.py'
      - '.github/workflows/godot-runtime.yml'
  pull_request:
    paths:
      - 'runtime_godot/**'
      - 'runtime_package.py'
      - 'rig_tools.py'
      - 'tests/test_runtime_skinning.py'
  workflow_dispatch:

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
      STRESS_MAX_RSS_KB: '524288'
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}"
          curl --fail --location --retry 4 --output "$archive" "$url"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Parse and import Godot project
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 90s "$GODOT" --headless --path runtime_godot --editor --quit

      - name: Headless runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 30s "$GODOT" --headless --path runtime_godot --quit-after 2

      - name: 220 live-agent stress smoke with RSS budget
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          metrics="${RUNNER_TEMP}/godot-stress-time.txt"
          output="${RUNNER_TEMP}/godot-stress-output.txt"

          set +e
          /usr/bin/time -v -o "$metrics" timeout 45s "$GODOT" --headless --path runtime_godot --script res://scripts/stress_harness.gd 2>&1 | tee "$output"
          stress_status=${PIPESTATUS[0]}
          set -e

          cat "$metrics"
          max_rss_kb="$(awk -F: '/Maximum resident set size \(kbytes\)/ {gsub(/^[[:space:]]+/, "", $2); print $2}' "$metrics")"
          if [[ ! "$max_rss_kb" =~ ^[0-9]+$ ]]; then
            echo "Unable to parse maximum RSS from /usr/bin/time output" >&2
            exit 1
          fi

          # Performance reporting is observability, not the correctness gate. The
          # harness exit code and RSS budget below remain mandatory. Some Godot
          # runner/log combinations can prefix or suppress a final stdout line,
          # so a missing summary marker must not turn a successful stress run red.
          stress_metric="$(awk 'index($0, "KROLIK_STRESS_METRIC ") {line=$0; sub(/^.*KROLIK_STRESS_METRIC /, "KROLIK_STRESS_METRIC ", line); metric=line} END {print metric}' "$output")"
          if [[ -z "$stress_metric" ]]; then
            stress_metric="KROLIK_STRESS_METRIC unavailable_in_captured_stdout"
            echo "Warning: metric summary marker was not captured; preserving runtime/RSS gates." >&2
            grep -F 'KROLIK_STRESS' "$output" >&2 || true
          fi

          echo "KROLIK_STRESS_PROCESS max_rss_kb=${max_rss_kb} max_rss_mib=$(( (max_rss_kb + 1023) / 1024 )) budget_kb=${STRESS_MAX_RSS_KB}"
          {
            echo '### KROLIK 220-agent runtime stress'
            echo
            echo "- ${stress_metric}"
            echo "- max_rss_kb=${max_rss_kb} (~$(( (max_rss_kb + 1023) / 1024 )) MiB), budget=${STRESS_MAX_RSS_KB} KiB"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( max_rss_kb > STRESS_MAX_RSS_KB )); then
            echo "Stress process exceeded conservative RSS budget: ${max_rss_kb} KiB > ${STRESS_MAX_RSS_KB} KiB" >&2
            exit 1
          fi
          if (( stress_status != 0 )); then
            echo "Godot stress harness exited with status ${stress_status}" >&2
            exit "$stress_status"
          fi
