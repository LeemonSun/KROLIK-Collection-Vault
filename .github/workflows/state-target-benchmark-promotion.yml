name: Benchmark Promotion State Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/state-target-benchmark-promotion.yml'

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append verified benchmark promotion state
        shell: bash
        env:
          STATE_PAYLOAD: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('docs/AUTONOMOUS_STATE.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 2026-09-15 — target-hardware benchmark collector promoted'
          if marker not in text:
              block = base64.b64decode(__import__('os').environ['STATE_PAYLOAD']).decode('utf-8')
              path.write_text(text.rstrip() + '\n' + block.lstrip(), encoding='utf-8', newline='\n')
          PY

      - name: Commit state update
        shell: bash
        run: |
          if git diff --quiet -- docs/AUTONOMOUS_STATE.md; then
            echo 'No state change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AUTONOMOUS_STATE.md
          git diff --cached --check
          git commit -m 'docs: record target benchmark promotion'
          git push origin HEAD:main
