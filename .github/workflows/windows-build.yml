name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['vault-*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build one-file EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KROLIK_Collection_Vault --add-data "web;web" --collect-all PIL --collect-all webview app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KROLIK-Collection-Vault-Windows
          path: dist/KROLIK_Collection_Vault.exe
