name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['vault-*']
    paths:
      - 'character_import.py'
      - 'import_integrity.py'
      - 'runtime_package.py'
      - 'runtime_package_integrity.py'
      - 'rig_tools.py'
      - 'rig_edit.py'
      - 'animation_content.py'
      - 'content/animations/**'
      - 'tools/build_core_vertical_slice.py'
      - 'tools/build_import_qa_matrix.py'
      - 'tools/import_character_package.py'
      - 'tools/validate_runtime_package.py'
      - 'tools/fetch_dwpose_model.py'
      - 'tests/test_character_import.py'
      - 'tests/test_character_import_modes.py'
      - 'tests/test_character_import_rig_edit.py'
      - 'tests/test_import_integrity.py'
      - 'tests/test_runtime_package_integrity.py'
      - 'tests/test_rig_edit.py'
      - 'tests/test_import_qa_matrix.py'
      - 'tests/test_core_vertical_slice.py'
      - 'tests/test_runtime_skinning.py'
      - 'tests/test_dwpose_backend.py'
      - 'tests/test_dwpose_model_bootstrap.py'
      - '.github/workflows/windows-build.yml'

jobs:
  core-import-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow numpy pyinstaller onnxruntime opencv-python-headless
      - name: Core import syntax and regressions
        shell: pwsh
        run: |
          python -m py_compile rig_edit.py character_import.py import_integrity.py runtime_package.py runtime_package_integrity.py rig_tools.py tools/build_core_vertical_slice.py tools/build_import_qa_matrix.py tools/import_character_package.py tools/validate_runtime_package.py tools/fetch_dwpose_model.py
          pytest -q tests/test_character_import.py tests/test_character_import_modes.py tests/test_character_import_rig_edit.py tests/test_import_integrity.py tests/test_runtime_package_integrity.py tests/test_rig_edit.py tests/test_import_qa_matrix.py tests/test_core_vertical_slice.py tests/test_runtime_skinning.py tests/test_dwpose_backend.py tests/test_dwpose_model_bootstrap.py
      - name: Build ordinary-image runtime package on Windows
        shell: pwsh
        run: |
          $slice = Join-Path $env:RUNNER_TEMP 'krolik-core-slice'
          python tools/build_core_vertical_slice.py --output-root $slice
          if (-not (Test-Path (Join-Path $slice 'exports/runtime/ci_core_slice/manifest.json'))) { throw 'Windows vertical-slice manifest missing' }
      - name: Build diverse import QA matrix on Windows
        shell: pwsh
        run: |
          $matrix = Join-Path $env:RUNNER_TEMP 'krolik-import-matrix'
          python tools/build_import_qa_matrix.py --output-root $matrix
          if (-not (Test-Path (Join-Path $matrix 'matrix.json'))) { throw 'Windows import QA matrix missing' }
      - name: Build one-file headless import CLI with optional DWPose runtime
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name KROLIK_Character_Import --paths . --add-data "content/animations;content/animations" --collect-all PIL --collect-all numpy --collect-all onnxruntime --collect-all cv2 tools/import_character_package.py
      - name: Execute packaged import CLI with manual joint correction on Windows
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'krolik-core-slice/fixture_input.png'
          $workspace = Join-Path $env:RUNNER_TEMP 'krolik-exe-import'
          $edit = Join-Path $env:RUNNER_TEMP 'krolik-joint-edit.json'
          @'
          {"schema":"krolik.rig-joint-overrides/1","format_version":1,"joints":{"left_wrist":{"x":0.16,"y":0.49}}}
          '@ | Set-Content -Path $edit -Encoding utf8
          & .\dist\KROLIK_Character_Import.exe $source --project-root $workspace --character-id windows-exe-ci --name 'Windows EXE CI' --heuristic-rig --joint-overrides $edit
          if ($LASTEXITCODE -ne 0) { throw "Packaged import CLI exited $LASTEXITCODE" }
          $packageFolder = Join-Path $workspace 'exports/runtime/windows-exe-ci'
          $manifestPath = Join-Path $packageFolder 'manifest.json'
          $packageReceipt = Join-Path $packageFolder 'package_receipt.json'
          if (-not (Test-Path $manifestPath)) { throw 'Packaged CLI did not emit runtime manifest' }
          if (-not (Test-Path $packageReceipt)) { throw 'Packaged CLI did not emit durable package receipt' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([math]::Abs([double]$manifest.rig.joints.left_wrist.x - 0.16) -gt 0.000001) { throw 'Packaged CLI did not preserve corrected wrist X' }
          if ([math]::Abs([double]$manifest.rig.joints.left_wrist.y - 0.49) -gt 0.000001) { throw 'Packaged CLI did not preserve corrected wrist Y' }
          $editFiles = Get-ChildItem (Join-Path $workspace 'imports/windows-exe-ci/derived/rig_edits/v1') -Recurse -Filter '*.json'
          if ($editFiles.Count -lt 1) { throw 'Packaged CLI did not persist rig edit provenance' }
          python tools/validate_runtime_package.py $packageReceipt
          if ($LASTEXITCODE -ne 0) { throw "Durable package reopen validator exited $LASTEXITCODE" }
      - name: Fetch pinned DWPose model and upstream pose fixture on Windows
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'dwpose/dw-ll_ucoco_384.onnx'
          python tools/fetch_dwpose_model.py --output $model
          if ($LASTEXITCODE -ne 0) { throw "DWPose model bootstrap exited $LASTEXITCODE" }
          python tools/fetch_dwpose_model.py --output $model --check
          if ($LASTEXITCODE -ne 0) { throw "DWPose model verification exited $LASTEXITCODE" }
          $pose = Join-Path $env:RUNNER_TEMP 'dwpose-pose1.png'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/IDEA-Research/DWPose/onnx/ControlNet-v1-1-nightly/test_imgs/pose1.png' -OutFile $pose
          if (-not (Test-Path $pose)) { throw 'Upstream DWPose pose fixture missing' }
      - name: Execute packaged Windows importer through real DWPose backend
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'dwpose/dw-ll_ucoco_384.onnx'
          $source = Join-Path $env:RUNNER_TEMP 'dwpose-pose1.png'
          $workspace = Join-Path $env:RUNNER_TEMP 'krolik-exe-dwpose'
          $env:KROLIK_DWPOSE_MODEL = $model
          & .\dist\KROLIK_Character_Import.exe $source --project-root $workspace --character-id windows-dwpose-ci --name 'Windows DWPose CI'
          if ($LASTEXITCODE -ne 0) { throw "Packaged DWPose import CLI exited $LASTEXITCODE" }
          $packageFolder = Join-Path $workspace 'exports/runtime/windows-dwpose-ci'
          $manifestPath = Join-Path $packageFolder 'manifest.json'
          $packageReceipt = Join-Path $packageFolder 'package_receipt.json'
          if (-not (Test-Path $manifestPath)) { throw 'DWPose packaged CLI did not emit runtime manifest' }
          if (-not (Test-Path $packageReceipt)) { throw 'DWPose packaged CLI did not emit package receipt' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.rig.backend -ne 'dwpose-onnx') { throw "Packaged EXE fell back from DWPose backend: $($manifest.rig.backend)" }
          $jointCount = @($manifest.rig.joints.PSObject.Properties).Count
          if ($jointCount -ne 15) { throw "Packaged DWPose EXE did not emit 15 KROLIK joints; actual=$jointCount" }
          if ($manifest.rig.bones.Count -ne 14) { throw 'Packaged DWPose EXE did not emit 14 KROLIK bones' }
          if (-not [bool]$manifest.quality.runtime_ready) { throw 'Packaged DWPose EXE produced runtime_ready=false' }
          python tools/validate_runtime_package.py $packageReceipt
          if ($LASTEXITCODE -ne 0) { throw "DWPose durable package validator exited $LASTEXITCODE" }
          Write-Host "KROLIK_WINDOWS_DWPOSE_EXE status=ok backend=$($manifest.rig.backend) joints=$jointCount bones=14 runtime_ready=true"
      - name: Upload verified Windows import CLI
        uses: actions/upload-artifact@v4
        with:
          name: KROLIK-Character-Import-Windows
          path: dist/KROLIK_Character_Import.exe
          if-no-files-found: error
          retention-days: 14

  full-product-exe:
    if: startsWith(github.ref, 'refs/tags/vault-')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Require canonical graphical application source
        shell: pwsh
        run: |
          if (-not (Test-Path app.py)) { throw 'Canonical app.py is missing; refusing to publish a fake full-product EXE.' }
      - name: Install full-product build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build one-file graphical EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name KROLIK_Collection_Vault --add-data "web;web" --add-data "content;content" --collect-all PIL --collect-all webview app.py
      - name: Upload full product EXE
        uses: actions/upload-artifact@v4
        with:
          name: KROLIK-Collection-Vault-Windows
          path: dist/KROLIK_Collection_Vault.exe
          if-no-files-found: error
