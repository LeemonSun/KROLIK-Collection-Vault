name: Handoff Snapshot Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'work/target-hardware-benchmark-20260915'
    paths:
      - 'HANDOFF_FOR_CLAUDE.md'
      - 'docs/**'
      - 'tools/run_target_hardware_benchmark.ps1'
      - '.github/workflows/handoff-snapshot-build.yml'

jobs:
  windows-handoff:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install verified importer build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow numpy pyinstaller onnxruntime opencv-python-headless

      - name: Validate handoff-critical source
        shell: pwsh
        run: |
          python -m py_compile character_import.py import_integrity.py runtime_package.py runtime_package_integrity.py rig_tools.py rig_edit.py animation_content.py tools/build_core_vertical_slice.py tools/import_character_package.py tools/validate_runtime_package.py
          pytest -q tests/test_character_import.py tests/test_character_import_modes.py tests/test_import_integrity.py tests/test_runtime_package_integrity.py tests/test_rig_edit.py tests/test_core_vertical_slice.py tests/test_runtime_skinning.py

      - name: Build current Windows one-file character importer
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name KROLIK_Character_Import --paths . --add-data "content/animations;content/animations" --collect-all PIL --collect-all numpy --collect-all onnxruntime --collect-all cv2 tools/import_character_package.py
          if (-not (Test-Path dist/KROLIK_Character_Import.exe)) { throw 'Windows importer executable missing' }

      - name: Execute packaged importer against production vertical slice
        shell: pwsh
        run: |
          $slice = Join-Path $env:RUNNER_TEMP 'krolik-handoff-slice'
          $workspace = Join-Path $env:RUNNER_TEMP 'krolik-handoff-exe'
          python tools/build_core_vertical_slice.py --output-root $slice
          if ($LASTEXITCODE -ne 0) { throw 'core vertical slice build failed' }
          $source = Join-Path $slice 'fixture_input.png'
          & .\dist\KROLIK_Character_Import.exe $source --project-root $workspace --character-id handoff-exe-ci --name 'Handoff EXE CI' --heuristic-rig
          if ($LASTEXITCODE -ne 0) { throw "packaged importer exited $LASTEXITCODE" }
          $receipt = Join-Path $workspace 'exports/runtime/handoff-exe-ci/package_receipt.json'
          if (-not (Test-Path $receipt)) { throw 'packaged importer receipt missing' }
          python tools/validate_runtime_package.py $receipt
          if ($LASTEXITCODE -ne 0) { throw 'packaged importer runtime package validation failed' }
          Write-Host 'KROLIK_HANDOFF_IMPORTER status=ok'

      - name: Assemble source and progress handoff
        shell: pwsh
        run: |
          $handoff = 'handoff_bundle'
          if (Test-Path $handoff) { Remove-Item $handoff -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $handoff | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $handoff 'docs') | Out-Null

          git archive --format=zip --output (Join-Path $handoff 'KROLIK-Collection-Vault-SOURCE.zip') HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }

          Copy-Item dist/KROLIK_Character_Import.exe (Join-Path $handoff 'KROLIK_Character_Import.exe') -Force
          Copy-Item HANDOFF_FOR_CLAUDE.md (Join-Path $handoff 'HANDOFF_FOR_CLAUDE.md') -Force
          Copy-Item docs/AUTONOMOUS_RUNBOOK.md (Join-Path $handoff 'docs/AUTONOMOUS_RUNBOOK.md') -Force
          Copy-Item docs/AUTONOMOUS_STATE.md (Join-Path $handoff 'docs/AUTONOMOUS_STATE.md') -Force
          Copy-Item docs/A2_DWPOSE_VALIDATION.md (Join-Path $handoff 'docs/A2_DWPOSE_VALIDATION.md') -Force
          Copy-Item docs/TARGET_HARDWARE_BENCHMARK.md (Join-Path $handoff 'docs/TARGET_HARDWARE_BENCHMARK.md') -Force

          $head = (git rev-parse HEAD).Trim()
          $branch = (git branch --show-current).Trim()
          $appPresent = Test-Path app.py
          $info = [ordered]@{
            schema = 'krolik.handoff-build/1'
            created_utc = [DateTime]::UtcNow.ToString('o')
            git_head = $head
            git_branch = $branch
            windows_importer_verified = $true
            graphical_app_source_present = [bool]$appPresent
            full_graphical_exe_included = $false
            full_graphical_exe_blocker = if ($appPresent) { 'Not built by handoff workflow.' } else { 'Canonical app.py is absent from Git; refusing to fabricate a full graphical EXE.' }
            read_first = 'HANDOFF_FOR_CLAUDE.md'
          }
          $info | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $handoff 'BUILD_INFO.json') -Encoding utf8

          @"
          KROLIK COLLECTION VAULT — HANDOFF SNAPSHOT

          Start with HANDOFF_FOR_CLAUDE.md.
          The SOURCE.zip contains the exact repository snapshot for this artifact.
          KROLIK_Character_Import.exe is the verified Windows one-file character import CLI.

          Important: the full graphical desktop EXE is NOT included because the canonical app.py source is currently absent from Git. The build intentionally refuses to fabricate that missing application source.
          "@ | Set-Content (Join-Path $handoff 'READ_ME_FIRST.txt') -Encoding utf8

          Get-ChildItem $handoff -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "KROLIK_HANDOFF_SNAPSHOT status=ok head=$head app_present=$appPresent"

      - name: Upload complete handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: KROLIK-Collection-Vault-Handoff
          path: handoff_bundle/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
