name: Gold Character Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/gold/**'
      - 'rig_tools.py'
      - 'character_import.py'
      - 'runtime_package.py'
      - 'import_integrity.py'
      - 'runtime_package_integrity.py'
      - 'rig_edit.py'
      - 'tools/materialize_gold_character.py'
      - 'tools/probe_gold_character.py'
      - 'tools/fetch_dwpose_model.py'
      - 'runtime_godot/scripts/character_agent.gd'
      - 'runtime_godot/scripts/runtime_rig.gd'
      - 'runtime_godot/scripts/imported_character_render_harness.gd'
      - '.github/workflows/gold-character-regression.yml'
  pull_request:
    paths:
      - 'qa/gold/**'
      - 'rig_tools.py'
      - 'character_import.py'
      - 'runtime_package.py'
      - 'import_integrity.py'
      - 'runtime_package_integrity.py'
      - 'rig_edit.py'
      - 'tools/materialize_gold_character.py'
      - 'tools/probe_gold_character.py'
      - 'tools/fetch_dwpose_model.py'
      - 'runtime_godot/scripts/character_agent.gd'
      - 'runtime_godot/scripts/runtime_rig.gd'
      - 'runtime_godot/scripts/imported_character_render_harness.gd'
      - '.github/workflows/gold-character-regression.yml'

jobs:
  gold-elf-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      KROLIK_DWPOSE_MODEL: models/dwpose/dw-ll_ucoco_384.onnx
      GOLD_ROOT: runtime_godot/.gold_character/probe
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install production gold-character dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnxruntime Pillow opencv-python-headless

      - name: Gold fixture source contract and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/materialize_gold_character.py tools/probe_gold_character.py
          rm -rf .gold_character_check
          python tools/materialize_gold_character.py \
            --output .gold_character_check/gold_elf_v1.webp
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          spec = json.loads(Path('qa/gold/gold_elf_v1.json').read_text(encoding='utf-8'))
          p = Path('.gold_character_check/gold_elf_v1.webp')
          data = p.read_bytes()
          assert hashlib.sha256(data).hexdigest() == spec['fixture']['sha256']
          assert len(data) == spec['fixture']['bytes']
          with Image.open(p) as im:
              assert im.size == (spec['fixture']['width'], spec['fixture']['height'])
              assert str(im.format).upper() == 'WEBP'
          print('KROLIK_GOLD_FIXTURE status=ok original_sha256=' + spec['source']['original_sha256'])
          PY

      - name: Cache pinned DWPose model
        uses: actions/cache@v4
        with:
          path: models/dwpose/dw-ll_ucoco_384.onnx
          key: dwpose-724f4ff2439ed61afb86fb8a1951ec39c6220682803b4a8bd4f598cd913b1843

      - name: Fetch and verify exact DWPose model
        run: |
          python tools/fetch_dwpose_model.py
          python tools/fetch_dwpose_model.py --check

      - name: Production import, DWPose and rig/skin probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GOLD_ROOT"
          python tools/probe_gold_character.py \
            --output-root "$GOLD_ROOT" \
            --require-dwpose

      - name: Upload Python gold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-elf-v1-python-evidence
          path: |
            runtime_godot/.gold_character/probe/gold_report.json
            runtime_godot/.gold_character/probe/gold_elf_v1.webp
            runtime_godot/.gold_character/probe/gold_elf_v1_cutout.png
            runtime_godot/.gold_character/probe/gold_elf_v1_skeleton_overlay.png
            runtime_godot/.gold_character/probe/gold_elf_v1_manifest.json
            runtime_godot/.gold_character/probe/workspace/exports/runtime/gold-elf-v1/package_receipt.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Download verified Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}"
          curl --fail --location --retry 4 --output "$archive" "$url"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 90s "$GODOT" --headless --path runtime_godot --editor --quit

      - name: Render real gold character and prove GPU deformation
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          KROLIK_RENDER_MANIFEST_PATH: res://.gold_character/probe/workspace/exports/runtime/gold-elf-v1/manifest.json
          KROLIK_RENDER_CHARACTER_ID: gold-elf-v1
          KROLIK_RENDER_RIG_BACKEND: dwpose-onnx
          KROLIK_RENDER_ARTIFACT_DIR: res://gold_character_render_artifacts
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          command -v xvfb-run >/dev/null || { echo 'xvfb-run is required' >&2; exit 1; }
          rm -rf runtime_godot/gold_character_render_artifacts
          timeout 90s xvfb-run -a -s '-screen 0 1280x900x24' \
            "$GODOT" --path runtime_godot --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/imported_character_render_harness.gd
          test -s runtime_godot/gold_character_render_artifacts/imported_baseline.png
          test -s runtime_godot/gold_character_render_artifacts/imported_posed.png

      - name: Upload real Godot gold render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-elf-v1-godot-render-evidence
          path: runtime_godot/gold_character_render_artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup materialized gold files
        if: always()
        shell: bash
        run: rm -rf .gold_character_check runtime_godot/.gold_character runtime_godot/gold_character_render_artifacts
