name: Godot Multi-Art World State

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'runtime_godot/scripts/multi_art_world_state_harness.gd'
      - 'runtime_godot/scripts/world_state.gd'
      - 'runtime_godot/scripts/population_lod.gd'
      - 'runtime_godot/scripts/character_agent.gd'
      - 'runtime_godot/scripts/runtime_package_cache.gd'
      - 'character_import.py'
      - 'runtime_package.py'
      - 'tools/fetch_pinned_qa_corpus.py'
      - 'tools/import_character_package.py'
      - 'qa/corpora/dwpose_domain_art_corpus_v1.json'
      - '.github/workflows/godot-multi-art-world-state.yml'

jobs:
  mixed-package-save-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: '.'
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
      QA_CORPUS_MANIFEST: 'qa/corpora/dwpose_domain_art_corpus_v1.json'
      KROLIK_MULTI_ART_MANIFEST_PATHS: 'res://.ci_multi_art/exports/runtime/multi_art_1/manifest.json;res://.ci_multi_art/exports/runtime/multi_art_2/manifest.json;res://.ci_multi_art/exports/runtime/multi_art_3/manifest.json;res://.ci_multi_art/exports/runtime/multi_art_4/manifest.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package dependencies
        run: pip install Pillow numpy

      - name: Fetch checksum-pinned distinct art corpus
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/krolik-multi-art-sources"
          rm -rf "$source_dir"
          python tools/fetch_pinned_qa_corpus.py \
            --manifest "$QA_CORPUS_MANIFEST" \
            --output-dir "$source_dir"
          test -s "$source_dir/anime1.png"
          test -s "$source_dir/anime2.png"
          test -s "$source_dir/anime3.jpg"
          test -s "$source_dir/anime4.jpg"

      - name: Build four sealed runtime packages
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/krolik-multi-art-sources"
          project_root="runtime_godot/.ci_multi_art"
          rm -rf "$project_root"
          python tools/import_character_package.py "$source_dir/anime1.png" --project-root "$project_root" --character-id multi_art_1 --heuristic-rig
          python tools/import_character_package.py "$source_dir/anime2.png" --project-root "$project_root" --character-id multi_art_2 --heuristic-rig
          python tools/import_character_package.py "$source_dir/anime3.jpg" --project-root "$project_root" --character-id multi_art_3 --heuristic-rig
          python tools/import_character_package.py "$source_dir/anime4.jpg" --project-root "$project_root" --character-id multi_art_4 --heuristic-rig
          for id in multi_art_1 multi_art_2 multi_art_3 multi_art_4; do
            test -s "$project_root/exports/runtime/$id/manifest.json"
            test -s "$project_root/exports/runtime/$id/package_receipt.json"
          done

      - name: Download checksum-pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 4 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Import and syntax-check mixed world harness
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 90s "$GODOT" --headless --path runtime_godot --editor --quit
          timeout 30s "$GODOT" --headless --path runtime_godot --check-only --script res://scripts/multi_art_world_state_harness.gd

      - name: Save destroy reload 200 characters across four packages
        shell: bash
        run: |
          set -uo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          output="${RUNNER_TEMP}/krolik-multi-art-world.txt"
          status=0
          timeout --signal=TERM --kill-after=10s 120s \
            "$GODOT" --headless --path runtime_godot --audio-driver Dummy \
            --script res://scripts/multi_art_world_state_harness.gd 2>&1 | tee "$output" || status=${PIPESTATUS[0]}
          echo "KROLIK_MULTI_ART_WORLD_PROCESS_STATUS=${status}"
          grep -q 'KROLIK_MULTI_ART_WORLD status=ok agents=200 packages=4' "$output"
          if grep -Eq 'KROLIK_MULTI_ART_WORLD_FAIL|SCRIPT ERROR|Parse Error|Failed to load script' "$output"; then
            exit 1
          fi
          if (( status != 0 )); then
            exit "$status"
          fi
          python - "$output" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          m = re.search(
              r'KROLIK_MULTI_ART_WORLD status=ok agents=200 packages=4 full=40 reduced=60 sleeping=100 '
              r'spawn_ms=([0-9.]+) capture_ms=([0-9.]+) save_ms=([0-9.]+) load_ms=([0-9.]+) '
              r'restore_ms=([0-9.]+) save_bytes=([0-9]+) cache_parses=([0-9]+) cache_decodes=([0-9]+) cache_hits=([0-9]+)',
              text,
          )
          if not m:
              raise SystemExit('mixed world metrics marker missing or malformed')
          spawn_ms, capture_ms, save_ms, load_ms, restore_ms = map(float, m.groups()[:5])
          save_bytes, parses, decodes, hits = map(int, m.groups()[5:])
          print(
              f'KROLIK_MULTI_ART_WORLD_GATE save_mib={save_bytes/1048576:.3f} '
              f'spawn_ms={spawn_ms:.2f} capture_ms={capture_ms:.2f} save_ms={save_ms:.2f} '
              f'load_ms={load_ms:.2f} restore_ms={restore_ms:.2f} cache_hits={hits}'
          )
          if parses != 4 or decodes != 4:
              raise SystemExit(f'mixed package cache regression: parses={parses} decodes={decodes}')
          if hits < 396:
              raise SystemExit(f'mixed package cache hit count too low: {hits}')
          if save_bytes > 1024 * 1024:
              raise SystemExit(f'200-character mixed world save too large: {save_bytes} bytes')
          if spawn_ms > 5000 or capture_ms > 2000 or save_ms > 1000 or load_ms > 1000 or restore_ms > 5000:
              raise SystemExit('mixed world persistence exceeded first-pass performance ceiling')
          PY

      - name: Cleanup generated fixtures and packages
        if: always()
        shell: bash
        run: |
          rm -rf runtime_godot/.ci_multi_art
          rm -rf "${RUNNER_TEMP}/krolik-multi-art-sources"
