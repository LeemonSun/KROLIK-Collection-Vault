name: D4 Bootstrap Apply

on:
  push:
    branches:
      - work/d4-long-term-memory-20260915

permissions:
  contents: write

jobs:
  apply-d4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/d4-long-term-memory-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and apply D4 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap_d4/patch.gz.b64 | gzip -d > /tmp/d4.patch
          git apply --check /tmp/d4.patch
          git apply /tmp/d4.patch
          python -m py_compile life_sim.py ai_policy.py
          python tools/export_ai_policy.py --check
          python -m pip install -q pytest
          python -m pytest -q tests/test_life_sim.py tests/test_ai_policy.py
      - name: Commit D4 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add life_sim.py ai_policy.py runtime_godot/scripts/agent_brain.gd runtime_godot/scripts/memory_harness.gd tests/test_life_sim.py tests/test_ai_policy.py content/ai/default_policy_v1.json runtime_godot/data/ai_policy_v1.json
          git diff --cached --check
          git commit -m 'feat: add D4 durable affinity and favorite-place memory'
          git push origin HEAD:work/d4-long-term-memory-20260915
