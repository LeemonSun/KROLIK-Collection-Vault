name: Bootstrap Cutout V3

on:
  push:
    branches:
      - 'work/user-stylized-corpus-v1-20260915'
    paths:
      - '.github/workflows/bootstrap-cutout-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/user-stylized-corpus-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: pip install pytest numpy Pillow opencv-python-headless
      - name: Apply cutout v3 integration
        run: python tools/apply_cutout_v3_patch.py
      - name: Verify matte and import contracts
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile character_import.py cutout_matte.py
          pytest -q tests/test_cutout_matte_v3.py tests/test_cutout_grabcut_v2.py tests/test_character_import.py tests/test_character_import_modes.py tests/test_auto_rig_review.py
      - name: Commit verified product integration
        run: |
          git config user.name "KROLIK CI"
          git config user.email "actions@users.noreply.github.com"
          git add character_import.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "cutout: integrate matte v3 into production import"
          git push origin HEAD:work/user-stylized-corpus-v1-20260915
