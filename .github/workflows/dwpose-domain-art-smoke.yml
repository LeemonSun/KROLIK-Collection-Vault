name: DWPose Domain Art Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rig_tools.py'
      - 'character_import.py'
      - 'runtime_package.py'
      - 'import_integrity.py'
      - 'runtime_package_integrity.py'
      - 'qa/corpora/dwpose_domain_art_corpus_v1.json'
      - 'tools/fetch_dwpose_model.py'
      - 'tools/fetch_pinned_qa_corpus.py'
      - 'tools/smoke_dwpose_corpus.py'
      - 'tools/build_dwpose_vertical_slice.py'
      - 'tests/test_auto_rig_review.py'
      - 'tests/test_qa_corpus.py'
      - 'runtime_godot/scripts/core_vertical_slice_harness.gd'
      - 'runtime_godot/scripts/imported_character_render_harness.gd'
      - '.github/workflows/dwpose-domain-art-smoke.yml'
  pull_request:
    paths:
      - 'rig_tools.py'
      - 'character_import.py'
      - 'runtime_package.py'
      - 'import_integrity.py'
      - 'runtime_package_integrity.py'
      - 'qa/corpora/dwpose_domain_art_corpus_v1.json'
      - 'tools/fetch_dwpose_model.py'
      - 'tools/fetch_pinned_qa_corpus.py'
      - 'tools/smoke_dwpose_corpus.py'
      - 'tools/build_dwpose_vertical_slice.py'
      - 'tests/test_auto_rig_review.py'
      - 'tests/test_qa_corpus.py'
      - 'runtime_godot/scripts/core_vertical_slice_harness.gd'
      - 'runtime_godot/scripts/imported_character_render_harness.gd'
      - '.github/workflows/dwpose-domain-art-smoke.yml'

jobs:
  domain-art-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      KROLIK_DWPOSE_MODEL: models/dwpose/dw-ll_ucoco_384.onnx
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
      QA_CORPUS_MANIFEST: qa/corpora/dwpose_domain_art_corpus_v1.json
      QA_CORPUS_DIR: .qa_dwpose_domain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install production pose dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy onnxruntime Pillow opencv-python-headless
      - name: Auto-rig and corpus integrity regressions
        run: pytest -q tests/test_auto_rig_review.py tests/test_qa_corpus.py
      - name: Product-slice syntax and manifest contract
        run: |
          python -m py_compile tools/fetch_pinned_qa_corpus.py tools/build_dwpose_vertical_slice.py tools/smoke_dwpose_corpus.py
          python tools/fetch_pinned_qa_corpus.py --manifest "$QA_CORPUS_MANIFEST" --output-dir "$QA_CORPUS_DIR" --validate-only
      - name: Cache pinned DWPose model
        uses: actions/cache@v4
        with:
          path: models/dwpose/dw-ll_ucoco_384.onnx
          key: dwpose-724f4ff2439ed61afb86fb8a1951ec39c6220682803b4a8bd4f598cd913b1843
      - name: Fetch and verify exact DWPose model
        run: |
          python tools/fetch_dwpose_model.py
          python tools/fetch_dwpose_model.py --check
      - name: Fetch exact upstream domain fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$QA_CORPUS_DIR"
          python tools/fetch_pinned_qa_corpus.py \
            --manifest "$QA_CORPUS_MANIFEST" \
            --output-dir "$QA_CORPUS_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath

          manifest = json.loads(Path(os.environ['QA_CORPUS_MANIFEST']).read_text(encoding='utf-8'))
          root = Path(os.environ['QA_CORPUS_DIR'])
          fixtures = manifest['fixtures']
          if len(fixtures) < 12:
              raise SystemExit(f'expanded corpus unexpectedly small: {len(fixtures)}')
          missing = [
              PurePosixPath(case['path']).name
              for case in fixtures
              if not (root / PurePosixPath(case['path']).name).is_file()
          ]
          if missing:
              raise SystemExit(f'missing fetched fixtures: {missing}')
          print(f'KROLIK_DWPOSE_DOMAIN_FETCH status=ok fixtures={len(fixtures)}')
          PY
      - name: Production import and DWPose domain-art corpus gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t IMAGES < <(python - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath

          manifest = json.loads(Path(os.environ['QA_CORPUS_MANIFEST']).read_text(encoding='utf-8'))
          root = Path(os.environ['QA_CORPUS_DIR'])
          for case in manifest['fixtures']:
              print(root / PurePosixPath(case['path']).name)
          PY
          )
          test "${#IMAGES[@]}" -ge 12
          python tools/smoke_dwpose_corpus.py \
            "${IMAGES[@]}" \
            --min-dwpose-share 0.75 \
            --report "$QA_CORPUS_DIR/domain_report.json"
      - id: select_product_case
        name: Select a proven DWPose domain case for runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          report = json.loads((Path(os.environ['QA_CORPUS_DIR']) / 'domain_report.json').read_text())
          case = next((row for row in report.get('cases', []) if row.get('backend') == 'dwpose-onnx' and row.get('runtime_ready')), None)
          if case is None:
              raise SystemExit('no successful DWPose domain case available for product slice')
          image = str(case['image'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'image={image}\n')
          print(f'KROLIK_DWPOSE_PRODUCT_CASE image={image}')
          PY
      - name: Build sealed DWPose runtime package from domain art
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime_godot/.ci_dwpose_slice
          python tools/build_dwpose_vertical_slice.py \
            "$QA_CORPUS_DIR/${{ steps.select_product_case.outputs.image }}" \
            --output-root runtime_godot/.ci_dwpose_slice
          test -s runtime_godot/.ci_dwpose_slice/exports/runtime/ci_dwpose_slice/manifest.json
          test -s runtime_godot/.ci_dwpose_slice/exports/runtime/ci_dwpose_slice/package_receipt.json
      - name: Download verified Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}"
          curl --fail --location --retry 4 --output "$archive" "$url"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --version
      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 90s "$GODOT" --headless --path runtime_godot --editor --quit
      - name: Production DWPose package to Godot runtime gate
        shell: bash
        env:
          KROLIK_TEST_MANIFEST_PATH: res://.ci_dwpose_slice/exports/runtime/ci_dwpose_slice/manifest.json
          KROLIK_TEST_CHARACTER_ID: ci_dwpose_slice
          KROLIK_TEST_EXPECT_WIDTH: '0'
          KROLIK_TEST_EXPECT_HEIGHT: '0'
          KROLIK_TEST_RIG_BACKEND: dwpose-onnx
          KROLIK_TEST_MIN_RIG_SCORE: '99.0'
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 60s "$GODOT" --headless --path runtime_godot --script res://scripts/core_vertical_slice_harness.gd
      - name: Render DWPose production character evidence
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          KROLIK_RENDER_MANIFEST_PATH: res://.ci_dwpose_slice/exports/runtime/ci_dwpose_slice/manifest.json
          KROLIK_RENDER_CHARACTER_ID: ci_dwpose_slice
          KROLIK_RENDER_RIG_BACKEND: dwpose-onnx
          KROLIK_RENDER_ARTIFACT_DIR: res://dwpose_character_artifacts
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          command -v xvfb-run >/dev/null || { echo 'xvfb-run is required for DWPose render regression' >&2; exit 1; }
          rm -rf runtime_godot/dwpose_character_artifacts
          timeout 90s xvfb-run -a -s '-screen 0 1280x900x24' \
            "$GODOT" --path runtime_godot --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/imported_character_render_harness.gd
          test -s runtime_godot/dwpose_character_artifacts/imported_baseline.png
          test -s runtime_godot/dwpose_character_artifacts/imported_posed.png
      - name: Upload rendered DWPose character evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwpose-character-render-evidence
          path: runtime_godot/dwpose_character_artifacts/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload domain and product-slice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwpose-domain-art-product-slice
          path: |
            .qa_dwpose_domain/domain_report.json
            runtime_godot/.ci_dwpose_slice/exports/runtime/ci_dwpose_slice/manifest.json
            runtime_godot/.ci_dwpose_slice/exports/runtime/ci_dwpose_slice/package_receipt.json
            runtime_godot/.ci_dwpose_slice/imports/ci_dwpose_slice/receipts/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Cleanup QA and product slice
        if: always()
        shell: bash
        run: rm -rf "$QA_CORPUS_DIR" runtime_godot/.ci_dwpose_slice runtime_godot/dwpose_character_artifacts
