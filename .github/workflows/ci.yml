name: Vault CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow opencv-python-headless numpy
      - name: Core module syntax
        run: |
          python -m py_compile \
            ai_policy.py animation_content.py motion_quality.py pose_content.py prop_content.py rig_tools.py rig_migrations.py rig_edit.py runtime_package.py mesh_deform.py character_import.py import_integrity.py runtime_package_integrity.py \
            constraint_solver.py interaction_runtime.py life_sim.py \
            tools/export_ai_policy.py tools/validate_content.py tools/audit_source_readiness.py tools/build_core_vertical_slice.py tools/build_import_qa_matrix.py tools/import_character_package.py tools/validate_runtime_package.py
      - name: Verify generated AI policy copies
        run: python tools/export_ai_policy.py --check
      - name: Validate data-driven content
        run: python tools/validate_content.py
      - name: Build real-image-to-runtime core vertical slice
        run: python tools/build_core_vertical_slice.py --output-root "${RUNNER_TEMP}/krolik-core-slice"
      - name: Build diverse import QA matrix
        run: python tools/build_import_qa_matrix.py --output-root "${RUNNER_TEMP}/krolik-import-matrix"
      - name: Durable import and package reopen smoke
        run: |
          python tools/import_character_package.py "${RUNNER_TEMP}/krolik-core-slice/fixture_input.png" --project-root "${RUNNER_TEMP}/krolik-reopen" --character-id reopen-ci --name "Reopen CI" --heuristic-rig
          python tools/validate_runtime_package.py "${RUNNER_TEMP}/krolik-reopen/exports/runtime/reopen-ci/package_receipt.json"
      - name: Core regression suite
        run: |
          pytest -q \
            tests/test_ai_policy.py \
            tests/test_animation_pose.py \
            tests/test_animation_content.py \
            tests/test_motion_quality.py \
            tests/test_pose_content.py \
            tests/test_fixture_content.py \
            tests/test_dwpose_backend.py \
            tests/test_mesh_deform.py \
            tests/test_runtime_skinning.py \
            tests/test_rig_migrations.py \
            tests/test_rig_edit.py \
            tests/test_life_sim.py \
            tests/test_source_readiness.py \
            tests/test_character_import.py \
            tests/test_character_import_modes.py \
            tests/test_character_import_rig_edit.py \
            tests/test_import_integrity.py \
            tests/test_runtime_package_integrity.py \
            tests/test_import_qa_matrix.py \
            tests/test_core_vertical_slice.py

  canonical-source-readiness:
    runs-on: ubuntu-latest
    outputs:
      source_present: ${{ steps.source.outputs.source_present }}
      source_status: ${{ steps.source.outputs.source_status }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Audit canonical application source and recovery candidates
        shell: bash
        run: |
          set -euo pipefail
          output="$(python3 tools/audit_source_readiness.py)"
          printf '%s\n' "$output"
          status="$(printf '%s\n' "$output" | awk '/^KROLIK_SOURCE_READINESS / {for (i=1;i<=NF;i++) if ($i ~ /^status=/) {sub(/^status=/,"",$i); print $i}}')"
          if [[ -z "$status" ]]; then
            echo "Unable to parse source readiness status" >&2
            exit 1
          fi
          echo "source_status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "present" ]]; then
            echo "source_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=FULL PRODUCT SOURCE BLOCKED::Canonical app.py is absent. Core/runtime checks can pass, but backend/UI is NOT verified. Historical in-repo recovery artifacts are audit-only and must never be guessed into source."
          fi
          {
            echo '### Canonical application source readiness'
            echo
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
            echo
            if [[ "$status" == "present" ]]; then
              echo '**FULL SOURCE AVAILABLE:** backend/UI validation is enabled.'
            else
              echo '**FULL PRODUCT BLOCKED:** canonical `app.py` is not available in this revision; backend/UI validation is intentionally not counted as verified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  backend-and-ui:
    needs: canonical-source-readiness
    if: needs.canonical-source-readiness.outputs.source_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Backend tests
        run: pytest
      - name: HTTP smoke
        run: python tests/http_smoke.py
      - name: Headless UI smoke
        run: python tests/ui_mock_smoke.py
      - name: Upload UI snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-snapshot
          path: tests/ui_mock_screenshot.png
          if-no-files-found: ignore
