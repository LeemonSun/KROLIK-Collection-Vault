name: Vault CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Backend tests
        run: pytest
      - name: HTTP smoke
        run: python tests/http_smoke.py
      - name: Headless UI smoke
        run: python tests/ui_mock_smoke.py
      - name: Upload UI snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-snapshot
          path: tests/ui_mock_screenshot.png
          if-no-files-found: ignore
