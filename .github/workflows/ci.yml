name: Vault CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    outputs:
      restored: ${{ steps.source.outputs.restored }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Check application source integrity
        shell: bash
        run: |
          if [[ -f app.py ]]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "Application source is present."
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Source restoration pending::app.py is not present in this repository revision. Backend/UI validation is intentionally deferred until the guarded source-recovery workflow restores the validated bundle."
          fi

  backend-and-ui:
    needs: source-integrity
    if: needs.source-integrity.outputs.restored == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Backend tests
        run: pytest
      - name: HTTP smoke
        run: python tests/http_smoke.py
      - name: Headless UI smoke
        run: python tests/ui_mock_smoke.py
      - name: Upload UI snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-snapshot
          path: tests/ui_mock_screenshot.png
          if-no-files-found: ignore
