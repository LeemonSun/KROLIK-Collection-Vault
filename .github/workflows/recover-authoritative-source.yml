name: Recover authoritative Sep13 source

on:
  push:
    branches:
      - recovery/authoritative-source-20260913
    paths:
      - '.github/workflows/recover-authoritative-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout historical recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate historical source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          from pathlib import Path, PurePosixPath
          import zipfile

          root = Path('.')
          part_dir = root / 'tools' / 'source_restore_parts'
          ordered = [
              *[part_dir / f'part_{i:02d}.b64' for i in range(7)],
              part_dir / 'part_07.correct.b64',
              part_dir / 'part_08.b64',
              part_dir / 'part_09.b64',
          ]
          missing = [str(p) for p in ordered if not p.is_file()]
          if missing:
              raise SystemExit(f'missing recovery parts: {missing}')

          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in ordered)
          payload = base64.b64decode(encoded, validate=True)
          print(f'KROLIK_SOURCE_RECOVERY archive_bytes={len(payload)} sha256={hashlib.sha256(payload).hexdigest()}')

          expected = {
              'app.py',
              'smart_cutout.py',
              'runtime_package.py',
              'web/app.css', 'web/app.js', 'web/index.html',
              'tests/test_cutout_cache.py', 'tests/test_alpha_mesh.py',
              'tests/http_smoke.py', 'tests/live_barrel_demo.py',
              'tests/ui_mock_smoke.py', 'tests/real_barrel_render.py',
              'tests/test_backend.py', 'tests/test_checkpoint.py',
              'tools/prepare_ai_models.py', 'tools/qa_all_characters.py',
              'runtime_godot/scripts/runtime_prop.gd',
          }

          with zipfile.ZipFile(io.BytesIO(payload), 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt archive member: {bad}')
              names = {i.filename for i in archive.infolist() if not i.is_dir()}
              if names != expected:
                  raise SystemExit(
                      'recovery archive contents mismatch\n'
                      f'missing={sorted(expected - names)}\n'
                      f'unexpected={sorted(names - expected)}'
                  )
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  rel = PurePosixPath(info.filename)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
                  target = root.joinpath(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  data = archive.read(info)
                  target.write_bytes(data)
                  print(f'KROLIK_SOURCE_FILE path={info.filename} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')

          app = root / 'app.py'
          line_count = len(app.read_text(encoding='utf-8').splitlines())
          print(f'KROLIK_APP_SOURCE bytes={app.stat().st_size} lines={line_count} sha256={hashlib.sha256(app.read_bytes()).hexdigest()}')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile recovered backend
        run: python -m py_compile app.py

      - name: Run recovered backend regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Commit verified recovered source to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KROLIK Source Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            app.py smart_cutout.py runtime_package.py \
            web tests \
            runtime_godot/scripts/runtime_prop.gd \
            tools/prepare_ai_models.py tools/qa_all_characters.py
          if git diff --cached --quiet; then
            echo 'Historical source already matches branch.'
            exit 0
          fi
          git commit -m 'recover: verified authoritative Sep13 source snapshot'
          git push origin HEAD:${GITHUB_REF_NAME}
