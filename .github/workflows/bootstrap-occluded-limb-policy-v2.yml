name: Bootstrap Occluded Limb Policy V2

on:
  push:
    branches:
      - 'work/gold-elf-regression-20260915'
    paths:
      - '.github/workflows/bootstrap-occluded-limb-policy-v2.yml'

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/gold-elf-regression-20260915
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: pip install pytest numpy Pillow opencv-python-headless
      - name: Apply source patch
        run: python tools/apply_occluded_limb_policy_patch.py
      - name: Verify source patch
        run: |
          python -m py_compile rig_tools.py runtime_package.py tools/probe_gold_character.py
          pytest -q tests/test_dwpose_joint_confidence.py tests/test_joint_confidence_policy.py tests/test_runtime_joint_confidence.py tests/test_cutout_grabcut_v2.py tests/test_auto_rig_review.py
      - name: Commit product files
        run: |
          git config user.name "KROLIK CI"
          git config user.email "actions@users.noreply.github.com"
          git add rig_tools.py runtime_package.py tools/probe_gold_character.py
          git diff --cached --check
          git commit -m "qa: harden occluded limb confidence policy"
          git push origin HEAD:work/gold-elf-regression-20260915
