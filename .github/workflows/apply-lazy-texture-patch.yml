name: Apply Lazy Texture Residency Patch

on:
  push:
    branches:
      - work/f3-unique-package-scale-20260915
    paths:
      - '.github/workflows/apply-lazy-texture-patch.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/f3-unique-package-scale-20260915
          fetch-depth: 0

      - name: Patch lazy texture residency runtime
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          cache = Path('runtime_godot/scripts/runtime_package_cache.gd')
          text = cache.read_text(encoding='utf-8')
          marker = 'static func _cached_result(entry: Dictionary) -> Dictionary:\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('runtime_package_cache.gd: cached-result marker missing')
          new_tail = r'''static func _cached_result(entry: Dictionary, include_texture: bool = true) -> Dictionary:
              var manifest_value: Variant = entry.get("manifest", {})
              if typeof(manifest_value) != TYPE_DICTIONARY:
                  return {}
              var texture_value: Variant = entry.get("texture", null) if include_texture else null
              if include_texture and texture_value == null:
                  return {}
              var manifest: Dictionary = manifest_value
              return {
                  "manifest": manifest.duplicate(true),
                  "texture": texture_value,
                  "image_path": str(entry.get("image_path", "")),
              }

          static func load_package(manifest_path: String, include_texture: bool = true) -> Dictionary:
              var clean_path := manifest_path.strip_edges()
              if clean_path.is_empty() or not FileAccess.file_exists(clean_path):
                  return {}

              var manifest_stamp := _file_stamp(clean_path)
              var existing_value: Variant = _entries.get(clean_path, null)
              if typeof(existing_value) == TYPE_DICTIONARY:
                  var existing: Dictionary = existing_value
                  var image_path := str(existing.get("image_path", ""))
                  var image_stamp := _file_stamp(image_path)
                  if _same_stamp(existing.get("manifest_stamp", {}), manifest_stamp) and _same_stamp(existing.get("image_stamp", {}), image_stamp):
                      if include_texture:
                          var texture: Texture2D = existing.get("texture", null) as Texture2D
                          if texture == null:
                              texture = _decode_texture(existing)
                              if texture == null:
                                  return {}
                              _entries[clean_path] = existing
                          else:
                              _touch_texture(existing)
                              _entries[clean_path] = existing
                          _trim_texture_cache(clean_path)
                      _cache_hits += 1
                      return _cached_result(existing, include_texture)
                  _entries.erase(clean_path)
                  _invalidations += 1

              _cache_misses += 1
              var file := FileAccess.open(clean_path, FileAccess.READ)
              if file == null:
                  return {}
              var parsed: Variant = JSON.parse_string(file.get_as_text())
              file.close()
              if typeof(parsed) != TYPE_DICTIONARY:
                  return {}
              _manifest_parses += 1
              var manifest: Dictionary = parsed
              var visual_value: Variant = manifest.get("visual", {})
              if typeof(visual_value) != TYPE_DICTIONARY:
                  return {}
              var visual: Dictionary = visual_value
              var image_name := str(visual.get("file", "character.png")).strip_edges()
              if image_name.is_empty():
                  return {}
              var image_path := clean_path.get_base_dir().path_join(image_name)
              var image_stamp := _file_stamp(image_path)
              if image_stamp.is_empty():
                  return {}

              var canonical_manifest := manifest.duplicate(true)
              var entry := {
                  "manifest_stamp": manifest_stamp,
                  "image_stamp": image_stamp,
                  "manifest": canonical_manifest,
                  "image_path": image_path,
                  "texture": null,
                  "texture_access_tick": 0,
              }
              _entries[clean_path] = entry
              if include_texture:
                  var texture := _decode_texture(entry)
                  if texture == null:
                      _entries.erase(clean_path)
                      return {}
                  _entries[clean_path] = entry
                  _trim_texture_cache(clean_path)
              return _cached_result(entry, include_texture)
          '''
          new_tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_tail.splitlines()) + '\n'
          cache.write_text(text[:start] + new_tail, encoding='utf-8')

          replace_once(
              'runtime_godot/scripts/character_agent.gd',
              '''func load_runtime_manifest(manifest_path: String, build_runtime_resources: bool = true) -> bool:\n    var package: Dictionary = RuntimePackageCacheScript.load_package(manifest_path)\n    if package.is_empty():\n        return false\n    var manifest_value: Variant = package.get("manifest", {})\n    if typeof(manifest_value) != TYPE_DICTIONARY:\n        return false\n    var manifest: Dictionary = manifest_value\n    var shared_texture: Texture2D = package.get("texture", null) as Texture2D\n    if shared_texture == null:\n        return false\n    character_texture = shared_texture\n''',
              '''func load_runtime_manifest(manifest_path: String, build_runtime_resources: bool = true) -> bool:\n    var package: Dictionary = RuntimePackageCacheScript.load_package(manifest_path, build_runtime_resources)\n    if package.is_empty():\n        return false\n    var manifest_value: Variant = package.get("manifest", {})\n    if typeof(manifest_value) != TYPE_DICTIONARY:\n        return false\n    var manifest: Dictionary = manifest_value\n    var shared_texture: Texture2D = package.get("texture", null) as Texture2D\n    if build_runtime_resources and shared_texture == null:\n        return false\n    character_texture = shared_texture if build_runtime_resources else null\n'''
          )

          replace_once(
              'runtime_godot/scripts/character_agent.gd',
              '''    else:\n        _clear_character_visual()\n        if collision_rig != null:\n            collision_rig.clear()\n            collision_rig = null\n''',
              '''    else:\n        character_texture = null\n        _clear_character_visual()\n        if collision_rig != null:\n            collision_rig.clear()\n            collision_rig = null\n'''
          )

          replace_once(
              'runtime_godot/scripts/multi_art_lod_scale_harness.gd',
              '''    print("KROLIK_MULTI_ART_SCALE_METRIC agents=%d unique_packages=%d full=%d reduced=%d sleeping=%d resident=%d proxy=%d released=%d sample_frames=%d sample_seconds=%.4f sim_fps=%.2f awake=%d awake_moved=%d awake_moved_share=%.3f sleep_drift_max=%.3f cache_entries=%d cache_parses=%d cache_decodes=%d cache_hits=%d static_mib=%.2f static_max_mib=%.2f renderer=%s" % [\n        _agent_count, _manifest_paths.size(), int(tiers.get("full", 0)), int(tiers.get("reduced", 0)), int(tiers.get("sleeping", 0)), int(tiers.get("resident", 0)), int(tiers.get("proxy", 0)), int(tiers.get("released", 0)), _sample_frames, elapsed, fps, awake, awake_moved, awake_moved_share, sleeping_drift_max, int(cache.get("entries", 0)), int(cache.get("manifest_parses", 0)), int(cache.get("texture_decodes", 0)), int(cache.get("hits", 0)), static_mib, static_max_mib, renderer_name\n    ])\n''',
              '''    print("KROLIK_MULTI_ART_SCALE_METRIC agents=%d unique_packages=%d full=%d reduced=%d sleeping=%d resident=%d proxy=%d released=%d sample_frames=%d sample_seconds=%.4f sim_fps=%.2f awake=%d awake_moved=%d awake_moved_share=%.3f sleep_drift_max=%.3f cache_entries=%d cache_texture_entries=%d cache_limit=%d cache_parses=%d cache_decodes=%d cache_evictions=%d cache_hits=%d static_mib=%.2f static_max_mib=%.2f renderer=%s" % [\n        _agent_count, _manifest_paths.size(), int(tiers.get("full", 0)), int(tiers.get("reduced", 0)), int(tiers.get("sleeping", 0)), int(tiers.get("resident", 0)), int(tiers.get("proxy", 0)), int(tiers.get("released", 0)), _sample_frames, elapsed, fps, awake, awake_moved, awake_moved_share, sleeping_drift_max, int(cache.get("entries", 0)), int(cache.get("texture_entries", 0)), int(cache.get("texture_limit", 0)), int(cache.get("manifest_parses", 0)), int(cache.get("texture_decodes", 0)), int(cache.get("texture_evictions", 0)), int(cache.get("hits", 0)), static_mib, static_max_mib, renderer_name\n    ])\n'''
          )

          replace_once(
              'runtime_godot/scripts/multi_art_lod_scale_harness.gd',
              '''    if int(cache.get("entries", 0)) != _manifest_paths.size() or int(cache.get("manifest_parses", 0)) != _manifest_paths.size() or int(cache.get("texture_decodes", 0)) != _manifest_paths.size():\n        push_error("KROLIK MULTI ART scale: package cache did not preserve one entry/decode per unique package: " + str(cache)); quit(8); return\n''',
              '''    var cache_entries := int(cache.get("entries", 0))\n    var cache_texture_entries := int(cache.get("texture_entries", 0))\n    var cache_texture_limit := int(cache.get("texture_limit", 0))\n    var cache_decodes := int(cache.get("texture_decodes", 0))\n    if cache_entries != _manifest_paths.size() or int(cache.get("manifest_parses", 0)) != _manifest_paths.size():\n        push_error("KROLIK MULTI ART scale: manifest cache shape mismatch: " + str(cache)); quit(8); return\n    if cache_texture_limit <= 0 or cache_texture_entries > cache_texture_limit:\n        push_error("KROLIK MULTI ART scale: decoded texture cache exceeded its bound: " + str(cache)); quit(13); return\n    if cache_decodes > awake:\n        push_error("KROLIK MULTI ART scale: full texture decodes exceeded awake population: " + str(cache)); quit(14); return\n    if _manifest_paths.size() > cache_texture_limit and cache_decodes >= _manifest_paths.size():\n        push_error("KROLIK MULTI ART scale: lazy texture decode did not reduce unique-package residency: " + str(cache)); quit(15); return\n'''
          )

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'load_package(manifest_path, build_runtime_resources)' runtime_godot/scripts/character_agent.gd
          grep -q 'include_texture: bool = true' runtime_godot/scripts/runtime_package_cache.gd
          grep -q 'cache_texture_entries=' runtime_godot/scripts/multi_art_lod_scale_harness.gd

      - name: Commit runtime patch to work branch
        shell: bash
        run: |
          git config user.name 'LeemonSun'
          git config user.email 'wordolleemon@gmail.com'
          git add runtime_godot/scripts/runtime_package_cache.gd runtime_godot/scripts/character_agent.gd runtime_godot/scripts/multi_art_lod_scale_harness.gd
          if git diff --cached --quiet; then
            echo 'No patch changes to commit'
            exit 0
          fi
          git commit -m 'perf: lazy-load full textures by LOD residency'
          git push origin HEAD:work/f3-unique-package-scale-20260915
