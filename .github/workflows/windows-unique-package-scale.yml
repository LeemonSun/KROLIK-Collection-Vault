name: Windows Unique-Package Scale

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'tools/fanout_runtime_packages.py'
      - 'runtime_godot/scripts/multi_art_lod_scale_harness.gd'
      - 'runtime_godot/scripts/population_lod.gd'
      - 'runtime_godot/scripts/character_agent.gd'
      - 'runtime_godot/scripts/runtime_package_cache.gd'
      - 'character_import.py'
      - 'runtime_package.py'
      - 'runtime_package_integrity.py'
      - 'import_integrity.py'
      - 'tools/fetch_pinned_qa_corpus.py'
      - 'tools/import_character_package.py'
      - 'qa/corpora/dwpose_domain_art_corpus_v1.json'
      - '.github/workflows/windows-unique-package-scale.yml'

jobs:
  unique-package-curve:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      GODOT_VERSION: '4.7.2'
      GODOT_WIN_SHA256: '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
      QA_CORPUS_MANIFEST: 'qa/corpora/dwpose_domain_art_corpus_v1.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Fetch checksum-pinned four-art templates
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'krolik-unique-sources'
          if (Test-Path $sourceDir) { Remove-Item $sourceDir -Recurse -Force }
          python tools/fetch_pinned_qa_corpus.py --manifest $env:QA_CORPUS_MANIFEST --output-dir $sourceDir
          if ($LASTEXITCODE -ne 0) { throw 'QA source corpus fetch failed' }

      - name: Build four sealed template packages
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'krolik-unique-sources'
          $root = 'runtime_godot/.ci_unique_templates'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          $cases = @(
            @('anime1.png','template_1'),
            @('anime2.png','template_2'),
            @('anime3.jpg','template_3'),
            @('anime4.jpg','template_4')
          )
          foreach ($case in $cases) {
            python tools/import_character_package.py (Join-Path $sourceDir $case[0]) --project-root $root --character-id $case[1] --heuristic-rig
            if ($LASTEXITCODE -ne 0) { throw "template package build failed: $($case[1])" }
          }

      - name: Fan out 500 independently sealed package paths
        shell: pwsh
        run: |
          $out = 'runtime_godot/.ci_unique'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          python tools/fanout_runtime_packages.py `
            --template-package runtime_godot/.ci_unique_templates/exports/runtime/template_1 `
            --template-package runtime_godot/.ci_unique_templates/exports/runtime/template_2 `
            --template-package runtime_godot/.ci_unique_templates/exports/runtime/template_3 `
            --template-package runtime_godot/.ci_unique_templates/exports/runtime/template_4 `
            --output-root $out `
            --count 500 `
            --id-prefix u
          if ($LASTEXITCODE -ne 0) { throw '500-package fanout failed' }
          $index = Get-Content "$out/package_index.json" -Raw | ConvertFrom-Json
          if ([int]$index.count -ne 500 -or @($index.manifests).Count -ne 500) { throw 'fanout index count mismatch' }
          if (-not (Test-Path "$out/packages/u_0000/package_receipt.json")) { throw 'first fanout receipt missing' }
          if (-not (Test-Path "$out/packages/u_0499/package_receipt.json")) { throw 'last fanout receipt missing' }

      - name: Download checksum-pinned official Godot for Windows
        shell: pwsh
        run: |
          $archive = "Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_WIN_SHA256) { throw "Godot Windows SHA256 mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath godot-bin -Force
          $godot = Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe"
          $versionOutput = (& $godot --version 2>&1 | Out-String).Trim()
          Write-Host $versionOutput
          if ($versionOutput -notmatch [regex]::Escape($env:GODOT_VERSION)) { throw 'unexpected Godot version output' }
          $global:LASTEXITCODE = 0

      - name: Parse Godot project
        shell: pwsh
        run: |
          $godot = (Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          $importOutput = (& $godot --headless --path runtime_godot --editor --quit 2>&1 | Out-String)
          Write-Host $importOutput
          foreach ($pattern in @('SCRIPT ERROR', 'Parse Error', 'Failed to load script', 'Cannot get class', 'Could not resolve class')) {
            if ($importOutput -match [regex]::Escape($pattern)) { throw "Godot project import contained fatal marker: $pattern" }
          }
          $global:LASTEXITCODE = 0

      - name: Measure 32 128 and 500 unique package residency
        shell: pwsh
        run: |
          $godot = (Resolve-Path "godot-bin/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          $artifactDir = 'runtime_godot/windows_unique_package_artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $runtimeRoot = (Resolve-Path runtime_godot).Path
          $index = Get-Content 'runtime_godot/.ci_unique/package_index.json' -Raw | ConvertFrom-Json
          $allRows = @()

          foreach ($count in @(32, 128, 500)) {
            $selected = @($index.manifests | Select-Object -First $count)
            if ($selected.Count -ne $count) { throw "index cannot supply $count manifests" }
            $resPaths = @()
            foreach ($absolutePath in $selected) {
              $relative = [IO.Path]::GetRelativePath($runtimeRoot, [string]$absolutePath) -replace '\\','/'
              $resPaths += ('res://' + $relative)
            }
            $joined = $resPaths -join ';'
            if ($joined.Length -gt 30000) { throw "manifest environment payload too large at ${count}: $($joined.Length)" }

            $env:KROLIK_MULTI_ART_AGENTS = '500'
            $env:KROLIK_MULTI_ART_WARMUP_FRAMES = '15'
            $env:KROLIK_MULTI_ART_SAMPLE_FRAMES = '60'
            $env:KROLIK_MULTI_ART_MAX_SECONDS = '90'
            $env:KROLIK_MULTI_ART_FULL_RADIUS = '180'
            $env:KROLIK_MULTI_ART_SLEEP_RADIUS = '360'
            $env:KROLIK_MULTI_ART_WAKE_RADIUS = '330'
            $env:KROLIK_MULTI_ART_MANIFEST_PATHS = $joined
            $env:KROLIK_MULTI_ART_SCREENSHOT_PATH = "res://windows_unique_package_artifacts/stress_unique_$count.png"

            $stdout = Join-Path $artifactDir "unique_${count}_stdout.txt"
            $stderr = Join-Path $artifactDir "unique_${count}_stderr.txt"
            $arguments = @('--path','runtime_godot','--rendering-method','gl_compatibility','--audio-driver','Dummy','--script','res://scripts/multi_art_lod_scale_harness.gd')
            $process = Start-Process -FilePath $godot -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = (Get-Date).AddSeconds(240)
            [long]$peak = 0
            while (-not $process.HasExited) {
              Start-Sleep -Milliseconds 100
              $process.Refresh()
              if ($process.WorkingSet64 -gt $peak) { $peak = $process.WorkingSet64 }
              if ((Get-Date) -gt $deadline) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw "unique-package stress $count exceeded watchdog"
              }
            }
            $process.WaitForExit()
            $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
            $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            Write-Host "===== UNIQUE PACKAGES $count ====="
            Write-Host $out
            if ($err) { Write-Host '--- stderr ---'; Write-Host $err }
            if ($process.ExitCode -ne 0) { throw "Godot unique-package run $count failed: $($process.ExitCode)" }
            if ($out -match 'KROLIK MULTI ART scale:' -or $err -match 'SCRIPT ERROR|Parse Error|Failed to load script') { throw "unique-package run $count emitted failure marker" }

            $metric = ($out -split "`r?`n" | Where-Object { $_ -like 'KROLIK_MULTI_ART_SCALE_METRIC *' } | Select-Object -Last 1)
            $render = ($out -split "`r?`n" | Where-Object { $_ -like 'KROLIK_MULTI_ART_RENDER *' } | Select-Object -Last 1)
            if (-not $metric -or -not $render) { throw "metrics/render marker missing for $count unique packages" }
            [double]$fps = 0
            [int]$reportedUnique = 0
            [int]$entries = 0
            [int]$parses = 0
            [int]$decodes = 0
            if ($metric -match 'sim_fps=([0-9]+(?:\.[0-9]+)?)') { $fps = [double]$Matches[1] }
            if ($metric -match 'unique_packages=([0-9]+)') { $reportedUnique = [int]$Matches[1] }
            if ($metric -match 'cache_entries=([0-9]+)') { $entries = [int]$Matches[1] }
            if ($metric -match 'cache_parses=([0-9]+)') { $parses = [int]$Matches[1] }
            if ($metric -match 'cache_decodes=([0-9]+)') { $decodes = [int]$Matches[1] }
            if ($reportedUnique -ne $count -or $entries -ne $count -or $parses -ne $count -or $decodes -ne $count) {
              throw "unique-package cache shape mismatch count=$count reported=$reportedUnique entries=$entries parses=$parses decodes=$decodes"
            }
            if ($fps -le 0.0) { throw "invalid FPS at $count unique packages" }
            $row = [ordered]@{
              unique_packages = $count
              agents = 500
              fps = $fps
              peak_working_set_bytes = $peak
              peak_working_set_mib = [math]::Round($peak / 1MB, 2)
              cache_entries = $entries
              cache_parses = $parses
              cache_decodes = $decodes
              metric = $metric
              render = $render
            }
            $allRows += [pscustomobject]$row
            Write-Host "KROLIK_UNIQUE_PACKAGE_POINT unique=$count fps=$fps peak_mib=$($row.peak_working_set_mib)"
          }

          $allRows | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $artifactDir 'unique_package_curve.json') -Encoding utf8
          $p32 = $allRows | Where-Object unique_packages -eq 32 | Select-Object -First 1
          $p128 = $allRows | Where-Object unique_packages -eq 128 | Select-Object -First 1
          $p500 = $allRows | Where-Object unique_packages -eq 500 | Select-Object -First 1
          Write-Host "KROLIK_UNIQUE_PACKAGE_CURVE p32_fps=$($p32.fps) p32_mib=$($p32.peak_working_set_mib) p128_fps=$($p128.fps) p128_mib=$($p128.peak_working_set_mib) p500_fps=$($p500.fps) p500_mib=$($p500.peak_working_set_mib)"
          if ([long]$p500.peak_working_set_bytes -gt 3221225472) { throw '500-unique package run exceeded 3 GiB exploratory memory ceiling' }

      - name: Upload unique-package curve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unique-package-scale
          path: runtime_godot/windows_unique_package_artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup generated stress packages
        if: always()
        shell: pwsh
        run: |
          if (Test-Path runtime_godot/.ci_unique) { Remove-Item runtime_godot/.ci_unique -Recurse -Force }
          if (Test-Path runtime_godot/.ci_unique_templates) { Remove-Item runtime_godot/.ci_unique_templates -Recurse -Force }
          $sourceDir = Join-Path $env:RUNNER_TEMP 'krolik-unique-sources'
          if (Test-Path $sourceDir) { Remove-Item $sourceDir -Recurse -Force }
