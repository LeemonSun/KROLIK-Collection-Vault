name: Bootstrap E1 Room Runtime

on:
  push:
    branches:
      - work/e1-room-ecosystem-20260915

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      GODOT_VERSION: 4.7.2
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/e1-room-ecosystem-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Generate runtime room library
        run: python tools/export_room_library.py
      - name: Python validation
        run: |
          python -m pip install pytest
          python -m py_compile room_content.py tools/export_room_library.py tools/validate_content.py
          python tools/export_room_library.py --check
          python tools/validate_content.py content
          pytest -q tests/test_room_content.py tests/test_fixture_content.py
      - name: Download verified Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 4 --output "$archive" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Godot room vertical check
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${GITHUB_WORKSPACE}/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          timeout 90s "$GODOT" --headless --path runtime_godot --editor --quit
          output="${RUNNER_TEMP}/e1-room.txt"
          timeout 30s "$GODOT" --headless --path runtime_godot --script res://scripts/room_catalog_harness.gd 2>&1 | tee "$output"
          grep -q 'KROLIK_ROOM_CATALOG status=ok' "$output"
          if grep -Eq 'KROLIK_ROOM_CATALOG_FAIL|SCRIPT ERROR|Parse Error|Failed to load script' "$output"; then exit 1; fi
      - name: Commit verified runtime room data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_godot/data/rooms_v1.json
          if git diff --cached --quiet; then
            echo 'Room runtime copy already synchronized.'
            exit 0
          fi
          git commit -m 'vault: sync room library into Godot runtime'
          git push origin HEAD:work/e1-room-ecosystem-20260915
