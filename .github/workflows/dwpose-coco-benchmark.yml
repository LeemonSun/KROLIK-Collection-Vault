name: DWPose COCO Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rig_tools.py'
      - 'dwpose_benchmark.py'
      - 'tools/fetch_dwpose_model.py'
      - 'tools/benchmark_dwpose_coco.py'
      - 'tests/test_dwpose_benchmark.py'
      - '.github/workflows/dwpose-coco-benchmark.yml'

jobs:
  compact-coco-ground-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnxruntime Pillow opencv-python-headless pytest
      - name: Benchmark metric regressions
        run: |
          python -m py_compile dwpose_benchmark.py tools/benchmark_dwpose_coco.py
          pytest -q tests/test_dwpose_benchmark.py
      - name: Restore cached pinned DWPose model
        uses: actions/cache@v4
        with:
          path: models/dwpose/dw-ll_ucoco_384.onnx
          key: dwpose-724f4ff2439ed61afb86fb8a1951ec39c6220682803b4a8bd4f598cd913b1843
      - name: Fetch or verify pinned official DWPose model
        run: |
          python tools/fetch_dwpose_model.py
          python tools/fetch_dwpose_model.py --check
      - name: Fetch compact MMPose COCO ground-truth fixture
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mmpose-coco"
          mkdir -p "$root"
          base="https://raw.githubusercontent.com/open-mmlab/mmpose/main/tests/data/coco"
          for file in test_coco.json 000000000785.jpg 000000040083.jpg 000000196141.jpg 000000197388.jpg; do
            curl --fail --location --retry 4 --output "$root/$file" "$base/$file"
            test -s "$root/$file"
          done
      - name: Measure production DWPose against COCO human ground truth
        run: |
          python tools/benchmark_dwpose_coco.py \
            "${RUNNER_TEMP}/mmpose-coco/test_coco.json" \
            "${RUNNER_TEMP}/mmpose-coco" \
            --max-samples 4 --min-keypoints 15
